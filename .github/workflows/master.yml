name: Build LG CaymanLM Vendor Image

on:
  workflow_dispatch:
  push:
    branches:
      - sixteen
      - main

permissions:
  contents: read

env:
  VENDOR_REPO: https://github.com/afzalhaider8755slk-cell/proprietary_vendor_lge_caymanlm.git
  VENDOR_BRANCH: sixteen
  DEVICE: caymanlm
  ANDROID_TARGET: android-16
  LINEAGE_TARGET: lineage-23.2

jobs:
  build-vendor:
    name: Build vendor.img
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout vendor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show runner storage
        run: |
          echo "=== Disk ==="
          df -h
          echo
          echo "=== Memory ==="
          free -h
          echo
          echo "=== CPU ==="
          nproc

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            e2fsprogs \
            android-libext4-utils \
            android-libselinux \
            android-selinux \
            rsync \
            git \
            python3 \
            python3-pip \
            file \
            unzip \
            zip \
            gzip \
            tar \
            xz-utils \
            lz4 \
            zstd

      - name: Prepare vendor source
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/work/vendor"

          if [ -d "proprietary/vendor" ]; then
            rsync -aHAX --numeric-ids \
              proprietary/vendor/ \
              "$GITHUB_WORKSPACE/work/vendor/"
          else
            echo "::error::proprietary/vendor directory not found"
            exit 1
          fi

          echo "Vendor source:"
          du -sh "$GITHUB_WORKSPACE/work/vendor"

          echo "File count:"
          find "$GITHUB_WORKSPACE/work/vendor" -type f | wc -l

      - name: Vendor compatibility audit
        run: |
          set +e

          mkdir -p audit

          {
            echo "======================================"
            echo "LG CAYMANLM VENDOR AUDIT"
            echo "LineageOS 23.2 / Android 16"
            echo "======================================"
            echo

            echo "=== Source ==="
            echo "Repository: $VENDOR_REPO"
            echo "Branch: $VENDOR_BRANCH"
            echo "Target: $LINEAGE_TARGET"
            echo

            echo "=== Size ==="
            du -sh work/vendor
            echo

            echo "=== File count ==="
            find work/vendor -type f | wc -l
            echo

            echo "=== Fingerprint related ==="
            find work/vendor -type f | grep -Ei \
              'finger|fps|biometric|goodix|fpc|synaptics' || true
            echo

            echo "=== Vibration / haptics ==="
            find work/vendor -type f | grep -Ei \
              'vibrat|haptic|linear_motor|motor' || true
            echo

            echo "=== RIL / Dual SIM ==="
            find work/vendor -type f | grep -Ei \
              'ril|radio|qcril|ims|modem|telephony|uim|sim' || true
            echo

            echo "=== Audio ==="
            find work/vendor -type f | grep -Ei \
              'audio|acdb|adsp|snd|sound|codec' || true
            echo

            echo "=== IMS / VoWiFi ==="
            find work/vendor -type f | grep -Ei \
              'ims|volte|vowifi|wifi.*call|carrier|qti.*ims' || true
            echo

            echo "=== Wi-Fi ==="
            find work/vendor -type f | grep -Ei \
              'wifi|wlan|wpa|hostapd|qca' || true
            echo

            echo "=== HAL / VINTF ==="
            find work/vendor -type f | grep -Ei \
              'manifest.*xml|compatibility.*xml|vintf' || true
            echo

            echo "=== ELF libraries ==="
            find work/vendor -type f \( -name '*.so' -o -name '*.so.*' \) \
              | wc -l
            echo

            echo "=== Broken symlinks ==="
            find -L work/vendor -type l -print
            echo

            echo "=== Suspicious zero-byte files ==="
            find work/vendor -type f -size 0 -print
            echo

          } | tee audit/vendor-audit.txt

          exit 0

      - name: Prepare SELinux file contexts
        run: |
          set -eux

          mkdir -p image

          if [ -f proprietary/vendor/etc/selinux/vendor_file_contexts ]; then
            cp proprietary/vendor/etc/selinux/vendor_file_contexts \
              image/vendor_file_contexts
          elif [ -f proprietary/vendor/etc/selinux/plat_file_contexts ]; then
            cp proprietary/vendor/etc/selinux/plat_file_contexts \
              image/vendor_file_contexts
          else
            echo "No vendor_file_contexts found in vendor tree."
            echo "Creating conservative fallback context file."
            touch image/vendor_file_contexts
          fi

      - name: Calculate vendor image size
        run: |
          set -eux

          USED_KB=$(du -sk work/vendor | awk '{print $1}')

          # Extra room for filesystem metadata and runtime/vendor additions.
          EXTRA_KB=$((256 * 1024))

          IMAGE_KB=$((USED_KB + EXTRA_KB))

          # Round up to 4 MiB.
          IMAGE_KB=$(( ((IMAGE_KB + 4095) / 4096) * 4096 ))

          echo "Vendor data: ${USED_KB} KB"
          echo "Extra room: ${EXTRA_KB} KB"
          echo "Image size: ${IMAGE_KB} KB"

          echo "IMAGE_KB=$IMAGE_KB" >> "$GITHUB_ENV"

      - name: Build vendor.img
        run: |
          set -eux

          rm -f vendor.img

          mke2fs \
            -t ext4 \
            -b 4096 \
            -m 0 \
            -O ^has_journal \
            -L vendor \
            "vendor.img" \
            "${IMAGE_KB}K"

          mkdir -p image/mnt

          sudo mount -o loop vendor.img image/mnt

          sudo rsync -aHAX \
            work/vendor/ \
            image/mnt/

          sudo sync
          sudo umount image/mnt

          e2fsck -fy vendor.img || true

          echo "=== vendor.img ==="
          ls -lh vendor.img
          file vendor.img
          du -h vendor.img

      - name: Vendor image verification
        run: |
          set -eux

          mkdir -p verify/mnt

          sudo mount -o loop,ro vendor.img verify/mnt

          echo "=== Root ==="
          sudo ls -lah verify/mnt

          echo "=== Vendor directories ==="
          sudo find verify/mnt -maxdepth 2 -type d | sort | head -100

          echo "=== Required feature audit ==="

          for feature in \
            "Fingerprint|finger|fps|biometric" \
            "Vibration|vibrat|haptic|motor" \
            "RIL|ril|qcril|radio|modem|sim" \
            "Audio|audio|acdb|adsp|sound" \
            "IMS|ims|volte|vowifi" \
            "WiFi|wifi|wlan|wpa"; do

            NAME="${feature%%|*}"
            PATTERN="${feature#*|}"

            COUNT=$(sudo find verify/mnt -type f \
              | grep -Ei "$PATTERN" \
              | wc -l || true)

            echo "$NAME: $COUNT matching files"
          done

          sudo umount verify/mnt

          echo
          echo "=== Filesystem check ==="
          e2fsck -fn vendor.img

      - name: Create compressed vendor package
        run: |
          set -eux

          mkdir -p output

          cp vendor.img output/vendor.img

          # tar.gz preserves the complete image as a single compressed file.
          tar -C output \
            -czf vendor-caymanlm-lineage23.2.tar.gz \
            vendor.img

          sha256sum output/vendor.img \
            > output/vendor.img.sha256

          sha256sum vendor-caymanlm-lineage23.2.tar.gz \
            > output/vendor-caymanlm-lineage23.2.tar.gz.sha256

          cp audit/vendor-audit.txt output/vendor-audit.txt

          echo "=== Output ==="
          ls -lh output/

      - name: Upload vendor package
        uses: actions/upload-artifact@v4
        with:
          name: caymanlm-vendor-lineage23.2
          path: |
            output/vendor-caymanlm-lineage23.2.tar.gz
            output/vendor-caymanlm-lineage23.2.tar.gz.sha256
            output/vendor.img.sha256
            output/vendor-audit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload raw vendor image separately
        uses: actions/upload-artifact@v4
        with:
          name: caymanlm-vendor-raw
          path: output/vendor.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p failure-logs

          df -h > failure-logs/disk.txt || true
          free -h > failure-logs/memory.txt || true
          nproc > failure-logs/cpu.txt || true

          find . -maxdepth 3 -type f \
            \( -name '*.log' -o -name '*.txt' \) \
            -print > failure-logs/files.txt || true

          cp audit/vendor-audit.txt \
            failure-logs/vendor-audit.txt 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: caymanlm-vendor-build-failure-logs
          path: failure-logs/
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14
