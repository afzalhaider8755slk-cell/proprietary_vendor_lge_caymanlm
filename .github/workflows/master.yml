name: "LM-G900 Android 16 QPR2 - Vendor Only Fix"

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST_URL: "https://github.com/LineageOS/android.git"
  ANDROID_BRANCH: "lineage-23.2"
  DEVICE_CODENAME: "caymanlm"
  MODEL: "LM-G900"
  PRODUCT: "lineage_caymanlm-userdebug"
  VENDOR_ORG: "lge-qcom-dev"
  DEVICE_REPO: "android_device_lge_caymanlm"
  VENDOR_REPO: "proprietary_vendor_lge_caymanlm"
  COMMON_VENDOR_REPO: "proprietary_vendor_lge_sm7250-common"
  DIAG_DIR: "ci-diagnostics/vendor"

jobs:
  vendor:
    name: "Vendor only - LM-G900"
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: "V00 - Checkout repository"
        id: v00
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: "V00 - Create diagnostics"
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$DIAG_DIR" "$GITHUB_WORKSPACE/vendor_out"
          {
            echo "LG Velvet LM-G900 - VENDOR ONLY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "model=$MODEL"
            echo "codename=$DEVICE_CODENAME"
            echo "product=$PRODUCT"
            echo "android_branch=$ANDROID_BRANCH"
            echo "started=$(date -u +%FT%TZ)"
          } | tee "$GITHUB_WORKSPACE/$DIAG_DIR/00-run.log"

      - name: "V01 - Install build dependencies"
        id: v01
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$GITHUB_WORKSPACE/$DIAG_DIR/01-dependencies.log"
          exec > >(tee -a "$log") 2>&1

          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zstd \
            unzip rsync bc ccache libssl-dev libelf-dev \
            python3 python3-pip jq lz4 liblz4-tool libxml2-utils \
            xsltproc

          if ! command -v repo >/dev/null 2>&1; then
            curl -fL --retry 3 --retry-delay 2 \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/repo"
            chmod +x "$HOME/repo"
            sudo install -m 0755 "$HOME/repo" /usr/local/bin/repo
          fi

          git --version
          repo --version
          python3 --version

      - name: "V02 - Initialize Android source"
        id: v02
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$GITHUB_WORKSPACE"
          log="$base/$DIAG_DIR/02-repo-init.log"
          exec > >(tee -a "$log") 2>&1

          rm -rf "$base/android"
          mkdir -p "$base/android"
          cd "$base/android"

          repo init \
            -u "$MANIFEST_URL" \
            -b "$ANDROID_BRANCH" \
            --depth=1 \
            --no-clone-bundle

          test -s "$base/android/.repo/manifests/default.xml"
          echo "V02 PASS: repo initialized."

      - name: "V03 - Resolve REAL LM-G900 vendor repositories"
        id: v03
        if: ${{ success() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$GITHUB_WORKSPACE"
          log="$base/$DIAG_DIR/03-vendor-manifest.log"
          exec > >(tee -a "$log") 2>&1

          cd "$base/android"
          mkdir -p .repo/local_manifests

          DEVICE_URL="https://github.com/${VENDOR_ORG}/${DEVICE_REPO}.git"
          VENDOR_URL="https://github.com/${VENDOR_ORG}/${VENDOR_REPO}.git"
          COMMON_URL="https://github.com/${VENDOR_ORG}/${COMMON_VENDOR_REPO}.git"

          echo "=== repository existence ==="
          git ls-remote --heads "$DEVICE_URL" >/dev/null
          git ls-remote --heads "$VENDOR_URL" >/dev/null
          git ls-remote --heads "$COMMON_URL" >/dev/null

          resolve_branch() {
            local url="$1"
            local preferred="$2"
            local result=""

            if git ls-remote --exit-code --heads "$url" "$preferred" >/dev/null 2>&1; then
              result="$preferred"
            elif git ls-remote --exit-code --heads "$url" "lineage-22.2" >/dev/null 2>&1; then
              result="lineage-22.2"
            else
              result="$(git ls-remote --symref "$url" HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')"
            fi

            test -n "$result"
            printf '%s' "$result"
          }

          DEVICE_BRANCH="$(resolve_branch "$DEVICE_URL" "$ANDROID_BRANCH")"
          VENDOR_BRANCH="$(resolve_branch "$VENDOR_URL" "$ANDROID_BRANCH")"
          COMMON_BRANCH="$(resolve_branch "$COMMON_URL" "$ANDROID_BRANCH")"

          echo "DEVICE_BRANCH=$DEVICE_BRANCH"
          echo "VENDOR_BRANCH=$VENDOR_BRANCH"
          echo "COMMON_BRANCH=$COMMON_BRANCH"

          {
            echo "DEVICE_BRANCH=$DEVICE_BRANCH"
            echo "VENDOR_BRANCH=$VENDOR_BRANCH"
            echo "COMMON_BRANCH=$COMMON_BRANCH"
          } >> "$GITHUB_ENV"

          cat > .repo/local_manifests/g900lm.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="g900github" fetch="https://github.com/" />

            <project
              name="${VENDOR_ORG}/${DEVICE_REPO}"
              path="device/lge/caymanlm"
              remote="g900github"
              revision="${DEVICE_BRANCH}" />

            <project
              name="${VENDOR_ORG}/${VENDOR_REPO}"
              path="vendor/lge/caymanlm"
              remote="g900github"
              revision="${VENDOR_BRANCH}" />

            <project
              name="${VENDOR_ORG}/${COMMON_VENDOR_REPO}"
              path="vendor/lge/sm7250-common"
              remote="g900github"
              revision="${COMMON_BRANCH}" />
          </manifest>
          EOF

          cat .repo/local_manifests/g900lm.xml
          repo manifest >/dev/null
          echo "V03 PASS: LM-G900 repositories and local manifest resolved."

      - name: "V04 - Verify refs BEFORE sync"
        id: v04
        if: ${{ success() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$GITHUB_WORKSPACE/$DIAG_DIR/04-ref-check.log"
          sync_log="$GITHUB_WORKSPACE/$DIAG_DIR/04-repo-sync.log"
          exec > >(tee -a "$log") 2>&1

          failures=0

          check_ref() {
            local repo="$1"
            local branch="$2"
            local url="https://github.com/${VENDOR_ORG}/${repo}.git"

            echo "CHECK $url @ refs/heads/$branch"
            if git ls-remote --exit-code --heads "$url" "$branch"; then
              echo "PASS $repo @ $branch"
            else
              echo "FAIL $repo @ $branch"
              failures=$((failures + 1))
            fi
          }

          check_ref "$DEVICE_REPO" "$DEVICE_BRANCH"
          check_ref "$VENDOR_REPO" "$VENDOR_BRANCH"
          check_ref "$COMMON_VENDOR_REPO" "$COMMON_BRANCH"

          if [[ "$failures" -ne 0 ]]; then
            echo "V04 STOP: invalid vendor ref(s)."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/android"
          set +e
          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --fail-fast \
            -j2 2>&1 | tee "$sync_log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "repo_sync_exit=$rc" | tee -a "$sync_log"
          exit "$rc"

      - name: "V05 - Verify synced vendor source"
        id: v05
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/05-source-verification.log"
          exec > >(tee -a "$log") 2>&1

          repo list | grep -E \
            'device/lge/caymanlm|vendor/lge/caymanlm|vendor/lge/sm7250-common'

          repo manifest -r

      - name: "V06 - Verify LM-G900 identity"
        id: v06
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/06-model-identity.log"
          exec > >(tee -a "$log") 2>&1

          echo "MODEL=$MODEL"
          echo "CODENAME=$DEVICE_CODENAME"
          echo "PRODUCT=$PRODUCT"

          grep -RniE 'LM-G900|caymanlm' \
            device/lge/caymanlm \
            vendor/lge/caymanlm \
            vendor/lge/sm7250-common 2>/dev/null | head -300 || true

      - name: "V07 - Prepare vendor build environment"
        id: v07
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/07-product-config.log"
          exec > >(tee -a "$log") 2>&1

          source build/envsetup.sh
          lunch "$PRODUCT"

          echo "PRODUCT_DEVICE=$(get_build_var PRODUCT_DEVICE)"
          echo "TARGET_PRODUCT=$(get_build_var TARGET_PRODUCT)"
          echo "TARGET_BUILD_VARIANT=$(get_build_var TARGET_BUILD_VARIANT)"

      - name: "V08 - Mandatory hardware integration audit"
        id: v08
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log"
          : > "$log"

          audit() {
            local label="$1"
            local pattern="$2"
            shift 2
            echo "=== $label ===" | tee -a "$log"
            if grep -RniE "$pattern" "$@" >> "$log" 2>&1; then
              echo "PASS: $label" | tee -a "$log"
            else
              echo "FAIL: $label" | tee -a "$log"
              return 1
            fi
          }

          audit "Fingerprint" \
            'fingerprint|fpc|goodix|biometric' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common

          audit "Vibration / haptics" \
            'vibrator|haptics|ff-memless|timed_output' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common

          audit "Dual-SIM / DSDS" \
            'dual.?sim|dsds|simslot|sim.?slot|multisim' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common

          audit "Audio" \
            'mixer_paths|audio_policy|audio_hw|primary\.sm|tinyalsa|snd' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common

          audit "Wi-Fi Calling / VoWiFi / IMS" \
            'ims|iwlan|vowifi|wifi.?calling|volte|carrier.?config' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common

      - name: "V09 - Build vendor.img ONLY"
        id: v09
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-build.log"
          exec > >(tee -a "$log") 2>&1

          source build/envsetup.sh
          lunch "$PRODUCT"

          set +e
          mka vendorimage 2>&1
          rc=${PIPESTATUS[0]}
          set -e

          echo "vendorimage_exit=$rc"
          echo "$rc" > "$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-exit-code.txt"
          exit "$rc"

      - name: "V10 - Verify vendor image and VINTF"
        id: v10
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/10-vendor-verification.log"
          exec > >(tee -a "$log") 2>&1

          out="out/target/product/$DEVICE_CODENAME"

          echo "=== vendor images ==="
          find "$out" -maxdepth 1 -type f \
            -name 'vendor*.img' -printf '%p %s bytes\n' 2>/dev/null || true

          echo "=== VINTF ==="
          find "$out/vendor/etc/vintf" -type f \
            -print 2>/dev/null | sort || true

          echo "=== required feature payload scan ==="
          grep -RniE \
            'fingerprint|vibrator|haptics|dual.?sim|dsds|mixer_paths|audio_policy|ims|iwlan|vowifi|wifi.?calling' \
            "$out/vendor" 2>/dev/null | head -500 || true

      - name: "V11 - ALWAYS collect diagnostics"
        id: v11
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p vendor_out

          {
            echo "LG Velvet LM-G900 - VENDOR ONLY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            echo "=== STEP OUTCOMES ==="
            echo "V01=${{ steps.v01.outcome }}"
            echo "V02=${{ steps.v02.outcome }}"
            echo "V03=${{ steps.v03.outcome }}"
            echo "V04=${{ steps.v04.outcome }}"
            echo "V05=${{ steps.v05.outcome }}"
            echo "V06=${{ steps.v06.outcome }}"
            echo "V07=${{ steps.v07.outcome }}"
            echo "V08=${{ steps.v08.outcome }}"
            echo "V09=${{ steps.v09.outcome }}"
            echo "V10=${{ steps.v10.outcome }}"
            echo
            echo "=== ERROR / FAILURE LINES ==="
            grep -RniE \
              'error|fatal|failed|failure|FAIL|ERROR|invalid|not found|does not exist|permission denied' \
              "$DIAG_DIR" 2>/dev/null | tail -1000 || true
          } > "$DIAG_DIR/99-ERROR-SUMMARY.log"

          out="android/out/target/product/$DEVICE_CODENAME"
          find "$out" -maxdepth 1 -type f \
            -name 'vendor*.img' -exec cp -v {} vendor_out/ \; 2>/dev/null || true

          {
            echo "MANDATORY ERROR LOG: ci-diagnostics/vendor/99-ERROR-SUMMARY.log"
            find "$DIAG_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            find vendor_out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          } > vendor_out/ARTIFACT-LIST.txt

          tar -czf \
            "vendor_out/LM-G900-VENDOR-DIAGNOSTICS-${GITHUB_RUN_ID}.tar.gz" \
            "$DIAG_DIR"

      - name: "Upload vendor diagnostics ALWAYS"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-VENDOR-${{ github.run_id }}"
          path: |
            vendor_out/**
            ci-diagnostics/vendor/**
          if-no-files-found: warn
          retention-days: 14

      - name: "Final - return vendor status"
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ steps.v03.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V03 repository resolution/manifest failed."
            exit 1
          fi

          if [[ "${{ steps.v04.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V04 repository/ref sync failed."
            exit 1
          fi

          if [[ "${{ steps.v08.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: mandatory hardware audit failed."
            exit 1
          fi

          if [[ "${{ steps.v09.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: vendorimage build failed."
            exit 1
          fi

          if [[ "${{ steps.v10.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: vendor verification failed."
            exit 1
          fi

          echo "VENDOR SUCCESS: vendor-only workflow completed."
