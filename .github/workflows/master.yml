name: LM-G900 Android Vendor Build (lineage-23.2)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  MANIFEST_URL: "https://github.com/LineageOS/android.git"
  ANDROID_BRANCH: "lineage-23.2"

  DEVICE_CODENAME: "caymanlm"
  MODEL: "LM-G900"
  PRODUCT: "lineage_caymanlm-userdebug"

  VENDOR_ORG: "Hirashi-so"
  DEVICE_REPO: "android_device_lge_caymanlm"
  VENDOR_REPO: "proprietary_vendor_lge_caymanlm"
  COMMON_VENDOR_REPO: "proprietary_vendor_lge_sm7250-common"

  DEVICE_BRANCH: "lineage-23.2"
  VENDOR_BRANCH: "lineage-23.2"
  COMMON_BRANCH: "lineage-23.2"

  DIAG_DIR: "ci-diagnostics/vendor"

jobs:

  vendor:

    name: LM-G900 Vendor Build - 75GB Runner

    runs-on: ubuntu-24.04

    timeout-minutes: 480

    steps:

      # ============================================================
      # V00 - CHECKOUT
      # ============================================================

      - name: V00 - Checkout repository
        id: v00
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      # ============================================================
      # V00.2 - EXTREME CLEANUP (more space)
      # ============================================================

      - name: V00.2 - Free runner storage (extreme)
        id: cleanup
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "EXTREME RUNNER CLEANUP"
          echo "=================================================="

          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/share/dotnet /usr/local/share/powershell /usr/local/lib/node_modules /opt/ghc /usr/share/ghc* /opt/hostedtoolcache /usr/local/share/boost /usr/local/julia /usr/local/graalvm /usr/share/swift /opt/microsoft /opt/pipx
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/*
          docker system prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          rm -rf ~/.cache/* ~/.gradle/caches/* ~/.npm/_cacache ~/.m2/repository/* ~/.cache/pip ~/.ccache
          sudo rm -rf /usr/local/lib/python* /tmp/* /var/tmp/*
          sync

          echo
          echo "STORAGE AFTER CLEANUP"
          df -h
          df -ih

      # ============================================================
      # V00.3 - CREATE DIAGNOSTICS
      # ============================================================

      - name: V00.3 - Create diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$DIAG_DIR" "$GITHUB_WORKSPACE/vendor_out"
          {
            echo "LG Velvet LM-G900 - VENDOR ONLY (lineage-23.2)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "model=$MODEL"
            echo "codename=$DEVICE_CODENAME"
            echo "product=$PRODUCT"
            echo "android_branch=$ANDROID_BRANCH"
            echo "vendor_branch=$VENDOR_BRANCH"
            echo "runner=$RUNNER_NAME"
            echo "started=$(date -u +%FT%TZ)"
          } | tee "$GITHUB_WORKSPACE/$DIAG_DIR/00-run.log"

      # ============================================================
      # V01 - INSTALL DEPENDENCIES
      # ============================================================

      - name: V01 - Install build dependencies and update repo
        id: v01
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$GITHUB_WORKSPACE/$DIAG_DIR/01-dependencies.log"
          exec > >(tee -a "$log") 2>&1

          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zstd unzip rsync bc ccache libssl-dev libelf-dev python3 python3-pip jq lz4 liblz4-tool libxml2-utils xsltproc
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          mkdir -p "$HOME/bin"
          curl -fL --retry 5 --retry-delay 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV

          which repo
          repo --version
          python3 --version
          df -h

      # ============================================================
      # V02 - INITIALIZE ANDROID SOURCE
      # ============================================================

      - name: V02 - Initialize Android source and update repo tool
        id: v02
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/bin:$PATH"
          base="$GITHUB_WORKSPACE"
          log="$base/$DIAG_DIR/02-repo-init.log"
          exec > >(tee -a "$log") 2>&1

          rm -rf "$base/android"
          mkdir -p "$base/android"
          cd "$base/android"

          # NOTE: --depth=1 is only valid here in repo init
          repo init -u "$MANIFEST_URL" -b "$ANDROID_BRANCH" --depth=1 --no-clone-bundle --repo-url=https://gerrit.googlesource.com/git-repo --repo-branch=stable
          repo selfupdate
          test -s "$base/android/.repo/manifests/default.xml"
          echo "V02 PASS"
          df -h

      # ============================================================
      # V03 - LOCAL MANIFEST
      # ============================================================

      - name: V03 - Create local manifest with lineage-23.2 branches
        id: v03
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/bin:$PATH"
          base="$GITHUB_WORKSPACE"
          log="$base/$DIAG_DIR/03-vendor-manifest.log"
          exec > >(tee -a "$log") 2>&1

          cd "$base/android"
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/g900lm.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="g900github" fetch="https://github.com/" />
            <project name="${VENDOR_ORG}/${DEVICE_REPO}" path="device/lge/caymanlm" remote="g900github" revision="${DEVICE_BRANCH}" />
            <project name="${VENDOR_ORG}/${VENDOR_REPO}" path="vendor/lge/caymanlm" remote="g900github" revision="${VENDOR_BRANCH}" />
            <project name="${VENDOR_ORG}/${COMMON_VENDOR_REPO}" path="vendor/lge/sm7250-common" remote="g900github" revision="${COMMON_BRANCH}" />
          </manifest>
          EOF

          cat .repo/local_manifests/g900lm.xml
          repo manifest >/dev/null
          echo "V03 PASS"

      # ============================================================
      # V04 - FULL REPO SYNC
      # ============================================================

      - name: V04 - Verify refs and full repo sync
        id: v04
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/bin:$PATH"
          base="$GITHUB_WORKSPACE"
          log="$base/$DIAG_DIR/04-ref-check.log"
          sync_log="$base/$DIAG_DIR/04-repo-sync.log"
          exec > >(tee -a "$log") 2>&1

          failures=0
          check_ref() {
            local repo="$1"
            local branch="$2"
            local url="https://github.com/${VENDOR_ORG}/${repo}.git"
            echo "CHECK $url @ refs/heads/$branch"
            if git ls-remote --exit-code --heads "$url" "$branch"; then
              echo "PASS $repo @ $branch"
            else
              echo "FAIL $repo @ $branch"
              failures=$((failures + 1))
            fi
          }

          check_ref "$DEVICE_REPO" "$DEVICE_BRANCH"
          check_ref "$VENDOR_REPO" "$VENDOR_BRANCH"
          check_ref "$COMMON_VENDOR_REPO" "$COMMON_BRANCH"

          if [[ "$failures" -ne 0 ]]; then
            echo "V04 STOP: invalid vendor ref(s)."
            exit 1
          fi

          cd "$base/android"
          df -h
          df -ih

          set +e
          max_retries=3
          attempt=1
          rc=1

          while [[ $attempt -le $max_retries ]]; do
            echo "FULL REPO SYNC ATTEMPT $attempt of $max_retries"
            # FIXED: Removed --depth=1 because it is NOT valid for repo sync
            timeout 5400 repo sync --current-branch --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j4 2>&1 | tee -a "$sync_log"
            rc=${PIPESTATUS[0]}

            if [[ $rc -eq 0 ]]; then
              echo "repo_sync_exit=0" | tee -a "$sync_log"
              break
            else
              echo "repo_sync_exit=$rc (attempt $attempt failed)" | tee -a "$sync_log"
              grep -E "Cannot fetch|Cannot checkout|GitCommandError" "$sync_log" | \
                sed -E 's/.*(Cannot fetch|Cannot checkout|GitCommandError).*[`'\'']([^`'\'']+)[`'\''].*/\2/' | \
                sort -u | while read -r proj; do
                  if [[ -n "$proj" ]]; then
                    echo "Removing problematic project: $proj"
                    rm -rf "$proj" || true
                  fi
                done
              if [[ $attempt -lt $max_retries ]]; then
                echo "Waiting 15 seconds..."
                sleep 15
              fi
              ((attempt++))
            fi
          done

          set -e
          df -h
          df -ih

          if [[ $rc -ne 0 ]]; then
            echo "FATAL: repo sync failed after $max_retries attempts." | tee -a "$sync_log"
            exit $rc
          fi

          if [[ ! -f "$base/android/build/envsetup.sh" ]]; then
            echo "FATAL: build/envsetup.sh is missing after sync!" | tee -a "$sync_log"
            exit 1
          fi

          echo "V04 PASS: full repo sync completed successfully."

      # ============================================================
      # V05 - VERIFY SYNCED SOURCE (NON-BLOCKING)
      # ============================================================

      - name: V05 - Verify synced vendor source
        id: v05
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          export PATH="$HOME/bin:$PATH"
          set +e
          cd "$GITHUB_WORKSPACE/android" 2>/dev/null || exit 0
          log="$GITHUB_WORKSPACE/$DIAG_DIR/05-source-verification.log"
          exec > >(tee -a "$log") 2>&1

          echo "=== REQUIRED PROJECTS ==="
          repo list | grep -E 'device/lge/caymanlm|vendor/lge/caymanlm|vendor/lge/sm7250-common'

          echo
          echo "=== PINNED MANIFEST ==="
          repo manifest -r

          exit 0

      # ============================================================
      # V06 - LM-G900 IDENTITY
      # ============================================================

      - name: V06 - Verify LM-G900 identity
        id: v06
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/06-model-identity.log"
          exec > >(tee -a "$log") 2>&1

          echo "MODEL=$MODEL, CODENAME=$DEVICE_CODENAME, PRODUCT=$PRODUCT"
          grep -RniE 'LM-G900|caymanlm' device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common 2>/dev/null | head -300 || true

      # ============================================================
      # V07 - BUILD ENVIRONMENT (FIXED: Added ENVSETUP_NO_COMPLETION)
      # ============================================================

      - name: V07 - Prepare vendor build environment
        id: v07
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/07-product-config.log"
          exec > >(tee -a "$log") 2>&1

          # Fix unbound variables in envsetup.sh
          export TOP=$(pwd)
          export ANDROID_GLOBAL_BUILD_PATHS=""
          export ZSH_VERSION=""
          # FIXED: Added this line to prevent unbound variable error
          export ENVSETUP_NO_COMPLETION="true"

          source build/envsetup.sh
          lunch "$PRODUCT"

          echo "PRODUCT_DEVICE=$(get_build_var PRODUCT_DEVICE)"
          echo "TARGET_PRODUCT=$(get_build_var TARGET_PRODUCT)"
          echo "TARGET_BUILD_VARIANT=$(get_build_var TARGET_BUILD_VARIANT)"

      # ============================================================
      # V08 - HARDWARE AUDIT (NON-FATAL)
      # ============================================================

      - name: V08 - Mandatory hardware integration audit
        id: v08
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log"
          : > "$log"

          audit() {
            local label="$1"
            local pattern="$2"
            shift 2
            echo "=== $label ===" | tee -a "$log"
            if grep -RniE "$pattern" "$@" >> "$log" 2>&1; then
              echo "PASS: $label" | tee -a "$log"
            else
              echo "WARN: No matching lines found for $label (non-blocking)." | tee -a "$log"
            fi
          }

          audit "Fingerprint" 'fingerprint|fpc|goodix|biometric' device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common
          audit "Vibration" 'vibrator|haptics|ff-memless|timed_output' device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common
          audit "Dual-SIM" 'dual.?sim|dsds|simslot|sim.?slot|multisim' device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common
          audit "Audio" 'mixer_paths|audio_policy|audio_hw|primary\.sm|tinyalsa|snd' device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common
          audit "Wi-Fi Calling/IMS" 'ims|iwlan|vowifi|wifi.?calling|volte|carrier.?config' device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common

      # ============================================================
      # V09 - BUILD VENDOR.IMG ONLY (FIXED: Added ENVSETUP_NO_COMPLETION)
      # ============================================================

      - name: V09 - Build vendor.img ONLY
        id: v09
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-build.log"
          exec > >(tee -a "$log") 2>&1

          # Fix unbound variables in envsetup.sh
          export TOP=$(pwd)
          export ANDROID_GLOBAL_BUILD_PATHS=""
          export ZSH_VERSION=""
          # FIXED: Added this line to prevent unbound variable error
          export ENVSETUP_NO_COMPLETION="true"

          source build/envsetup.sh
          lunch "$PRODUCT"

          df -h
          set +e
          mka vendorimage 2>&1
          rc=${PIPESTATUS[0]}
          set -e

          echo "vendorimage_exit=$rc"
          echo "$rc" > "$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-exit-code.txt"

          df -h
          exit "$rc"

      # ============================================================
      # V10 - VERIFY VENDOR IMAGE + VINTF
      # ============================================================

      - name: V10 - Verify vendor image and VINTF
        id: v10
        if: ${{ always() && steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/10-vendor-verification.log"
          exec > >(tee -a "$log") 2>&1

          out="out/target/product/$DEVICE_CODENAME"
          echo "=== VENDOR IMAGES ==="
          find "$out" -maxdepth 1 -type f -name 'vendor*.img' -printf '%p %s bytes\n' 2>/dev/null || true

          echo "=== VINTF ==="
          find "$out/vendor/etc/vintf" -type f -print 2>/dev/null | sort || true

          echo "=== FEATURE SCAN ==="
          grep -RniE 'fingerprint|vibrator|haptics|dual.?sim|dsds|mixer_paths|audio_policy|ims|iwlan|vowifi|wifi.?calling' "$out/vendor" 2>/dev/null | head -500 || true

      # ============================================================
      # V11 - ALWAYS COLLECT DIAGNOSTICS
      # ============================================================

      - name: V11 - ALWAYS collect diagnostics
        id: v11
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          export PATH="$HOME/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$DIAG_DIR" vendor_out

          df -h > "$DIAG_DIR/98-final-disk.log" 2>&1
          df -ih >> "$DIAG_DIR/98-final-disk.log" 2>&1

          {
            echo "LG Velvet LM-G900 - VENDOR ONLY (lineage-23.2)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            echo "=== STEP OUTCOMES ==="
            echo "V00=${{ steps.v00.outcome }}"
            echo "V01=${{ steps.v01.outcome }}"
            echo "V02=${{ steps.v02.outcome }}"
            echo "V03=${{ steps.v03.outcome }}"
            echo "V04=${{ steps.v04.outcome }}"
            echo "V05=${{ steps.v05.outcome }}"
            echo "V06=${{ steps.v06.outcome }}"
            echo "V07=${{ steps.v07.outcome }}"
            echo "V08=${{ steps.v08.outcome }}"
            echo "V09=${{ steps.v09.outcome }}"
            echo "V10=${{ steps.v10.outcome }}"
            echo
            echo "=== ERROR / FAILURE SUMMARY (full context) ==="
            grep -RniE 'error|fatal|failed|failure|FAIL|ERROR|invalid|not found|does not exist|permission denied|No space left on device|Errno 28|Unable|exception|traceback' "$DIAG_DIR" 2>/dev/null | tail -5000 || true
          } > "$DIAG_DIR/99-ERROR-SUMMARY.log"

          {
            echo "========== ERROR LOG (extracted) =========="
            echo "Generated: $(date -u +%FT%TZ)"
            echo
            grep -RniE 'error|fatal|failed|failure|FAIL|ERROR|invalid|not found|does not exist|permission denied|No space left on device|Errno 28|Unable|exception|traceback' "$DIAG_DIR" 2>/dev/null | head -2000
          } > "$DIAG_DIR/error.txt"

          out="android/out/target/product/$DEVICE_CODENAME"
          find "$out" -maxdepth 1 -type f -name 'vendor*.img' -exec cp -v {} vendor_out/ \; 2>/dev/null || true

          {
            echo "MANDATORY ERROR LOG (short version):"
            echo "$DIAG_DIR/error.txt"
            echo
            echo "=== DIAGNOSTIC FILES ==="
            find "$DIAG_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort
            echo
            echo "=== VENDOR OUTPUT ==="
            find vendor_out -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort
          } > vendor_out/ARTIFACT-LIST.txt

          tar -czf "vendor_out/LM-G900-VENDOR-DIAGNOSTICS-${GITHUB_RUN_ID}.tar.gz" "$DIAG_DIR" 2>/dev/null || true

      # ============================================================
      # V12 - UPLOAD ARTIFACTS ALWAYS
      # ============================================================

      - name: V12 - Upload vendor diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: LM-G900-VENDOR-${{ github.run_id }}
          path: |
            vendor_out/**
            ci-diagnostics/vendor/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: FINAL - Return vendor status
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ steps.v03.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V03 manifest creation failed."
            exit 1
          fi

          if [[ "${{ steps.v04.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V04 repo sync failed."
            exit 1
          fi

          if [[ "${{ steps.v08.outcome }}" != "success" ]]; then
            echo "VENDOR WARNING: V08 hardware audit had warnings (non-blocking)."
          fi

          if [[ "${{ steps.v09.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: vendorimage build failed."
            exit 1
          fi

          if [[ "${{ steps.v10.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: vendor verification failed."
            exit 1
          fi

          echo "=================================================="
          echo "VENDOR SUCCESS"
          echo "LM-G900 vendor-only workflow completed with lineage-23.2."
          echo "=================================================="
