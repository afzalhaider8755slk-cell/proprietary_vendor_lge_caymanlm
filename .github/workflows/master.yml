name: "LG Velvet G900EMW • Android 16 QPR2 • Vendor.img Only"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hardware identity
  DEVICE_MODEL: LM-G900
  DEVICE_VARIANT: G900EMW
  DEVICE: G900EMW
  CODENAME: caymanlm

  # Android / Lineage target
  LINEAGE_BRANCH: lineage-23.2

  # Device tree supplied by Afzal
  DEVICE_REPO: https://github.com/Hirashi-so/android_device_lge_caymanlm.git
  DEVICE_REF: sixteen

  # Proprietary vendor tree supplied by Afzal
  VENDOR_REPO: https://github.com/afzalhaider8755slk-cell/proprietary_vendor_lge_caymanlm.git
  VENDOR_REF: sixteen

  # Keep every uploaded artifact part safely below 500 MiB.
  ARTIFACT_CHUNK_SIZE: 450m

  # Android build
  TARGET: lineage_caymanlm-userdebug

jobs:

  vendor:
    name: "Build vendor.img"
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:

      # ------------------------------------------------------------
      # V01 — Checkout workflow only
      # ------------------------------------------------------------
      - name: "V01 • Checkout workflow"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # V02 — Create diagnostics immediately
      # ------------------------------------------------------------
      - name: "V02 • Initialize diagnostics"
        shell: bash
        run: |
          set -u

          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics/vendor"

          {
            echo "========================================"
            echo "LG Velvet G900EMW Vendor Build"
            echo "========================================"
            echo "device_model=${DEVICE_MODEL}"
            echo "device_variant=${DEVICE_VARIANT}"
            echo "device=${DEVICE}"
            echo "codename=${CODENAME}"
            echo "lineage_branch=${LINEAGE_BRANCH}"
            echo "device_repo=${DEVICE_REPO}"
            echo "device_ref=${DEVICE_REF}"
            echo "vendor_repo=${VENDOR_REPO}"
            echo "vendor_ref=${VENDOR_REF}"
            echo "target=${TARGET}"
            echo "artifact_chunk_size=${ARTIFACT_CHUNK_SIZE}"
            echo "android_target=Android 16 QPR2"
            echo "build_target=vendor.img only"
            echo "required_features=fingerprint,vibration,dual-sim/ril,audio,ims,wifi-calling/vowifi"
            echo "kernel_build=false"
            echo "========================================"
          } | tee "$GITHUB_WORKSPACE/ci-diagnostics/vendor/00-context.txt"

          df -h | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/00-disk-before.txt"

          free -h | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/00-memory-before.txt"

      # ------------------------------------------------------------
      # V03 — Free the runner's preinstalled storage
      # ------------------------------------------------------------
      - name: "V03 • Reclaim runner storage"
        shell: bash
        run: |
          set +e

          {
            echo "=== Disk before cleanup ==="
            df -h

            echo "=== Removing large preinstalled SDK/tool caches ==="

            sudo rm -rf /usr/local/lib/android/sdk/ndk/* 2>/dev/null || true
            sudo rm -rf /usr/local/lib/android/sdk/system-images/* 2>/dev/null || true
            sudo rm -rf /usr/local/lib/android/sdk/emulator/* 2>/dev/null || true

            sudo rm -rf /opt/ghc 2>/dev/null || true
            sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true

            sudo apt-get clean 2>/dev/null || true
            sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true

            echo "=== Disk after cleanup ==="
            df -h
          } 2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/01-storage-cleanup.log"

          df -h | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/01-disk-after-cleanup.txt"

      # ------------------------------------------------------------
      # V04 — Dependencies
      # ------------------------------------------------------------
      - name: "V04 • Install Android build dependencies"
        shell: bash
        run: |
          set -o pipefail

          sudo apt-get update 2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/02-apt-update.log"

          sudo apt-get install -y \
            git \
            git-lfs \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            unzip \
            curl \
            wget \
            rsync \
            bc \
            ccache \
            lz4 \
            lzop \
            liblz4-tool \
            libxml2-utils \
            xsltproc \
            pngcrush \
            schedtool \
            gperf \
            python3 \
            python3-pip \
            python3-protobuf \
            protobuf-compiler \
            lib32readline-dev \
            lib32z1-dev \
            lib32ncurses-dev \
            libc6-dev-i386 \
            libncurses-dev \
            libssl-dev \
            libxml2-dev \
            zlib1g-dev \
            libgl1-mesa-dev \
            fontconfig \
            erofs-utils \
            e2fsprogs \
            xxd \
            file \
            jq \
            pigz \
            pv \
            cpio \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/02-dependencies.log"

      # ------------------------------------------------------------
      # V05 — repo launcher
      # ------------------------------------------------------------
      - name: "V05 • Install repo launcher"
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/bin/repo"

          chmod 0755 "$RUNNER_TEMP/bin/repo"

          "$RUNNER_TEMP/bin/repo" version | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/03-repo-version.txt"

      # ------------------------------------------------------------
      # V06 — Initialize Lineage source
      # ------------------------------------------------------------
      - name: "V06 • Initialize LineageOS 23.2 source"
        shell: bash
        run: |
          set -o pipefail

          export PATH="$RUNNER_TEMP/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/android"
          cd "$RUNNER_TEMP/android"

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b "$LINEAGE_BRANCH" \
            --depth=1 \
            --no-repo-verify \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/04-repo-init.log"

          test -f .repo/manifest.xml

          repo version | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/04-repo-version.txt"

      # ------------------------------------------------------------
      # V07 — Local manifest
      # ------------------------------------------------------------
      - name: "V07 • Add G900EMW device and vendor trees"
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$RUNNER_TEMP/bin:$PATH"

          cd "$RUNNER_TEMP/android"

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/g900emw.xml <<EOF
          <manifest>

            <!--
              IMPORTANT:
              Do not redefine the standard LineageOS "github" remote.
              The previous workflow failed at repo sync because the
              local manifest attempted to redefine an existing remote
              with different attributes.
            -->
            <remote
              name="g900_lg_github"
              fetch="https://github.com/" />

            <project
              name="Hirashi-so/android_device_lge_caymanlm"
              path="device/lge/caymanlm"
              remote="g900_lg_github"
              revision="${DEVICE_REF}" />

            <project
              name="afzalhaider8755slk-cell/proprietary_vendor_lge_caymanlm"
              path="vendor/lge/caymanlm"
              remote="g900_lg_github"
              revision="${VENDOR_REF}" />

          </manifest>
          EOF

          cat .repo/local_manifests/g900emw.xml | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/05-local-manifest.xml"

      # ------------------------------------------------------------
      # V08 — Sync source
      # ------------------------------------------------------------
      - name: "V08 • Sync only required Android source"
        shell: bash
        run: |
          set -o pipefail

          export PATH="$RUNNER_TEMP/bin:$PATH"

          cd "$RUNNER_TEMP/android"

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2 \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/06-repo-sync.log"

      # ------------------------------------------------------------
      # V09 — Verify exact source
      # ------------------------------------------------------------
      - name: "V09 • Verify source trees"
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP/android"

          test -d device/lge/caymanlm
          test -d vendor/lge/caymanlm

          test -f device/lge/caymanlm/AndroidProducts.mk

          if [ ! -f device/lge/caymanlm/lineage_caymanlm.mk ]; then
            echo "::error::lineage_caymanlm.mk was not found."
            exit 1
          fi

          if [ ! -f vendor/lge/caymanlm/Android.bp ] &&
             [ ! -f vendor/lge/caymanlm/Android.mk ]; then
            echo "::error::Vendor Android.bp/Android.mk was not found."
            exit 1
          fi

          {
            echo "=== Device commit ==="
            git -C device/lge/caymanlm rev-parse HEAD

            echo "=== Vendor commit ==="
            git -C vendor/lge/caymanlm rev-parse HEAD

            echo "=== Device tree ==="
            find device/lge/caymanlm -maxdepth 2 -type f | sort | head -200

            echo "=== Vendor tree size ==="
            du -sh vendor/lge/caymanlm

            echo "=== Vendor file count ==="
            find vendor/lge/caymanlm -type f | wc -l
          } | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/07-source-verification.txt"

      # ------------------------------------------------------------
      # V10 — Hardware feature audit
      # ------------------------------------------------------------
      - name: "V10 • Audit required hardware compatibility"
        shell: bash
        run: |
          set +e

          cd "$RUNNER_TEMP/android"

          {
            echo "========================================"
            echo "REQUIRED HARDWARE AUDIT"
            echo "========================================"

            echo
            echo "===== FINGERPRINT ====="
            grep -RInE \
              'fingerprint|biometric|goodix|fod|fps|fpsph' \
              device/lge/caymanlm \
              vendor/lge/caymanlm \
              2>/dev/null | head -300

            echo
            echo "===== VIBRATION ====="
            grep -RInE \
              'vibrator|vibration|haptic|haptics|qpnp.*vib' \
              device/lge/caymanlm \
              vendor/lge/caymanlm \
              2>/dev/null | head -300

            echo
            echo "===== DUAL SIM / RIL ====="
            grep -RInE \
              'dual.?sim|dsds|ril|radio|telephony|modem' \
              device/lge/caymanlm \
              vendor/lge/caymanlm \
              2>/dev/null | head -400

            echo
            echo "===== AUDIO ====="
            grep -RInE \
              'audio|audio\.primary|audio_policy|mixer_paths|acdb' \
              device/lge/caymanlm \
              vendor/lge/caymanlm \
              2>/dev/null | head -400

            echo
            echo "===== IMS ====="
            grep -RInE \
              'ims|imsrcs|imsservice|qti.*ims' \
              device/lge/caymanlm \
              vendor/lge/caymanlm \
              2>/dev/null | head -400

            echo
            echo "===== WIFI CALLING / VOWIFI ====="
            grep -RInE \
              'vowifi|vo.?wifi|wifi.?calling|iwlan|epdg|wfc' \
              device/lge/caymanlm \
              vendor/lge/caymanlm \
              2>/dev/null | head -400

            echo
            echo "========================================"
            echo "AUDIT COMPLETE"
            echo "========================================"

          } 2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/08-hardware-audit.txt"

          exit 0

      # ------------------------------------------------------------
      # V11 — Explicit vendor file preservation audit
      # ------------------------------------------------------------
      - name: "V11 • Verify critical vendor payloads are present"
        shell: bash
        run: |
          set -u

          cd "$RUNNER_TEMP/android"

          LOG="$GITHUB_WORKSPACE/ci-diagnostics/vendor/09-critical-vendor-files.txt"

          {
            echo "=== Critical vendor payload audit ==="

            echo
            echo "--- Fingerprint candidates ---"
            find vendor/lge/caymanlm/proprietary/vendor \
              -type f \
              \( \
                -iname '*finger*' -o \
                -iname '*biometric*' -o \
                -iname '*fod*' -o \
                -iname '*fps*' \
              \) \
              -print 2>/dev/null | sort | head -200

            echo
            echo "--- Audio candidates ---"
            find vendor/lge/caymanlm/proprietary/vendor \
              -type f \
              \( \
                -iname '*audio*' -o \
                -iname '*mixer*' -o \
                -iname '*.acdb' \
              \) \
              -print 2>/dev/null | sort | head -300

            echo
            echo "--- RIL / IMS candidates ---"
            find vendor/lge/caymanlm/proprietary/vendor \
              -type f \
              \( \
                -iname '*ril*' -o \
                -iname '*ims*' -o \
                -iname '*radio*' \
              \) \
              -print 2>/dev/null | sort | head -300

            echo
            echo "--- Wi-Fi Calling / IWLAN candidates ---"
            find vendor/lge/caymanlm/proprietary/vendor \
              -type f \
              \( \
                -iname '*iwlan*' -o \
                -iname '*epdg*' -o \
                -iname '*vowifi*' -o \
                -iname '*wfc*' \
              \) \
              -print 2>/dev/null | sort | head -300

            echo
            echo "--- ACDB files ---"
            find vendor/lge/caymanlm/proprietary/vendor \
              -type f -iname '*.acdb' \
              -print 2>/dev/null | sort

          } 2>&1 | tee "$LOG"

      # ------------------------------------------------------------
      # V12 — Enforce required hardware/service feature preservation
      # ------------------------------------------------------------
      - name: "V12 • Enforce G900EMW hardware feature contract"
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/android"

          OUT="$GITHUB_WORKSPACE/ci-diagnostics/vendor/10-feature-contract.txt"

          {
            echo "========================================"
            echo "LG Velvet LM-G900 / G900EMW FEATURE CONTRACT"
            echo "========================================"
            echo "model=${DEVICE_MODEL}"
            echo "variant=${DEVICE_VARIANT}"
            echo "codename=${CODENAME}"
            echo
            echo "The build must preserve existing implementation/payloads for:"
            echo "  - Fingerprint / biometric"
            echo "  - Vibration / haptics"
            echo "  - Dual-SIM / RIL / telephony / modem"
            echo "  - Audio / mixer / ACDB"
            echo "  - IMS"
            echo "  - Wi-Fi Calling / VoWiFi / IWLAN / ePDG"
            echo
            echo "=== Device properties and feature declarations ==="
            grep -RInE               'fingerprint|biometric|vibrator|vibration|haptic|dual.?sim|dsds|ril|telephony|modem|audio|audio_policy|mixer_paths|acdb|ims|imsrcs|iwlan|epdg|vowifi|wifi.?calling|wfc'               device/lge/caymanlm               2>/dev/null | head -1000 || true

            echo
            echo "=== Vendor payloads ==="
            find vendor/lge/caymanlm/proprietary/vendor               -type f               \(                 -iname '*finger*' -o -iname '*biometric*' -o                 -iname '*vib*' -o -iname '*haptic*' -o                 -iname '*ril*' -o -iname '*radio*' -o -iname '*modem*' -o                 -iname '*audio*' -o -iname '*mixer*' -o -iname '*.acdb' -o                 -iname '*ims*' -o -iname '*iwlan*' -o -iname '*epdg*' -o                 -iname '*vowifi*' -o -iname '*wfc*'               \) -print 2>/dev/null | sort | head -1500 || true

            echo
            echo "=== Relevant Android properties ==="
            grep -RInE               'persist\.radio|ro\.telephony|telephony\.lpa|ims|iwlan|epdg|vowifi|wfc|wifi_calling|vibrator|fingerprint'               device/lge/caymanlm               vendor/lge/caymanlm               2>/dev/null | head -1000 || true

          } 2>&1 | tee "$OUT"

          # This is a preservation/audit contract, not a fake feature generator.
          # We fail only when the device/vendor trees are completely unable to
          # provide any implementation evidence for a required feature.
          declare -A FEATURE_PATTERNS=(
            [fingerprint]='fingerprint|biometric'
            [vibration]='vibrator|vibration|haptic'
            [dual_sim_ril]='dual.?sim|dsds|ril|telephony|modem'
            [audio]='audio|mixer|acdb'
            [ims]='ims|imsrcs'
            [wifi_calling]='vowifi|vo.?wifi|wifi.?calling|iwlan|epdg|wfc'
          )

          failed=0
          for feature in "${!FEATURE_PATTERNS[@]}"; do
            pattern="${FEATURE_PATTERNS[$feature]}"
            if ! grep -RIEq "$pattern"                 device/lge/caymanlm vendor/lge/caymanlm 2>/dev/null; then
              echo "::error::No source-tree evidence found for required feature: $feature"
              failed=1
            else
              echo "PASS: $feature"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Required G900EMW hardware/service feature contract was not satisfied."
            exit 1
          fi

      # ------------------------------------------------------------
      # V13 — Environment + lunch
      # ------------------------------------------------------------
      - name: "V13 • Prepare Android build environment"
        shell: bash
        run: |
          set -o pipefail

          cd "$RUNNER_TEMP/android"

          source build/envsetup.sh 2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/10-envsetup.log"

          lunch "$TARGET" 2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/11-lunch.log"

      # ------------------------------------------------------------
      # V14 — Product configuration audit
      # ------------------------------------------------------------
      - name: "V14 • Audit product vendor configuration"
        shell: bash
        run: |
          set +e

          cd "$RUNNER_TEMP/android"

          {
            echo "=== TARGET ==="
            echo "$TARGET"

            echo
            echo "=== PRODUCT VARIABLES ==="
            get_build_var PRODUCT_NAME
            get_build_var TARGET_DEVICE
            get_build_var TARGET_BUILD_VARIANT
            get_build_var TARGET_ARCH
            get_build_var BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE
            get_build_var BOARD_VENDORIMAGE_PARTITION_SIZE

            echo
            echo "=== DEVICE VENDOR CONFIG ==="
            grep -RInE \
              'vendor/lge/caymanlm|caymanlm-vendor' \
              device/lge/caymanlm \
              2>/dev/null | head -300

          } 2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/12-product-config.txt"

          exit 0

      # ------------------------------------------------------------
      # V15 — Build vendor.img ONLY
      # ------------------------------------------------------------
      - name: "V15 • Build vendor.img ONLY"
        shell: bash
        run: |
          set -o pipefail

          cd "$RUNNER_TEMP/android"

          source build/envsetup.sh

          lunch "$TARGET"

          echo "Starting vendorimage build..."

          m vendorimage \
            -j"$(nproc --all)" \
            2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/13-vendor-build.log"

      # ------------------------------------------------------------
      # V16 — Locate output robustly
      # ------------------------------------------------------------
      - name: "V16 • Locate vendor.img"
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP/android"

          PRODUCT_OUT="out/target/product/$CODENAME"

          test -d "$PRODUCT_OUT"

          {
            echo "=== Product output ==="
            du -sh "$PRODUCT_OUT"

            echo
            echo "=== vendor images ==="
            find "$PRODUCT_OUT" \
              -maxdepth 2 \
              -type f \
              \( \
                -name 'vendor.img' -o \
                -name 'vendor.img.*' \
              \) \
              -exec ls -lh {} \;
          } | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/14-output-location.txt"

          test -s "$PRODUCT_OUT/vendor.img"

      # ------------------------------------------------------------
      # V17 — Validate vendor.img
      # ------------------------------------------------------------
      - name: "V17 • Validate vendor.img"
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP/android"

          PRODUCT_OUT="out/target/product/$CODENAME"
          VENDOR_IMG="$PRODUCT_OUT/vendor.img"

          test -s "$VENDOR_IMG"

          {
            echo "=== vendor.img ==="
            ls -lh "$VENDOR_IMG"

            echo
            echo "=== file ==="
            file "$VENDOR_IMG"

            echo
            echo "=== sha256 ==="
            sha256sum "$VENDOR_IMG"

            echo
            echo "=== size bytes ==="
            stat -c '%s' "$VENDOR_IMG"

            echo
            echo "=== filesystem information ==="
            if command -v dump.erofs >/dev/null 2>&1; then
              dump.erofs "$VENDOR_IMG" 2>&1 || true
            fi

            if command -v tune2fs >/dev/null 2>&1; then
              tune2fs -l "$VENDOR_IMG" 2>&1 || true
            fi

          } | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/15-vendor-validation.txt"

      # ------------------------------------------------------------
      # V18 — VINTF / vendor payload audit
      # ------------------------------------------------------------
      - name: "V18 • Audit VINTF and critical payloads in vendor.img"
        shell: bash
        run: |
          set +e

          cd "$RUNNER_TEMP/android"

          PRODUCT_OUT="out/target/product/$CODENAME"

          {
            echo "=== Generated vendor-related files ==="

            find "$PRODUCT_OUT" \
              -type f \
              \( \
                -iname '*manifest*.xml' -o \
                -iname '*matrix*.xml' \
              \) \
              -print | sort

            echo
            echo "=== Vendor build intermediates ==="

            find "$PRODUCT_OUT/obj/PACKAGING" \
              -maxdepth 4 \
              -type f \
              2>/dev/null | sort | head -500

          } 2>&1 | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/16-vintf-audit.txt"

          exit 0

      # ------------------------------------------------------------
      # V19 — Compress vendor.img
      # ------------------------------------------------------------
      - name: "V19 • Create storage-safe vendor archive"
        shell: bash
        run: |
          set -euxo pipefail

          cd "$RUNNER_TEMP/android"

          PRODUCT_OUT="out/target/product/$CODENAME"

          mkdir -p "$GITHUB_WORKSPACE/vendor-result"

          cp "$PRODUCT_OUT/vendor.img" \
            "$GITHUB_WORKSPACE/vendor-result/vendor.img"

          cd "$GITHUB_WORKSPACE/vendor-result"

          sha256sum vendor.img | tee vendor.img.sha256

          # pigz is parallel gzip and significantly faster on the runner.
          tar -I "pigz -9" \
            -cf vendor.img.tar.gz \
            vendor.img

          sha256sum vendor.img.tar.gz | tee vendor.img.tar.gz.sha256

          {
            echo "=== Raw vendor.img ==="
            ls -lh vendor.img

            echo
            echo "=== Compressed archive ==="
            ls -lh vendor.img.tar.gz

            echo
            echo "=== Bytes ==="
            stat -c 'vendor.img=%s bytes' vendor.img
            stat -c 'vendor.img.tar.gz=%s bytes' vendor.img.tar.gz
          } | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/17-package-size.txt"

      # ------------------------------------------------------------
      # V20 — Ensure every artifact upload part <= 450 MiB
      # ------------------------------------------------------------
      - name: "V20 • Split archive if larger than 450 MiB"
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/vendor-result"

          rm -f vendor.img.tar.gz.part-* 2>/dev/null || true

          SIZE="$(stat -c '%s' vendor.img.tar.gz)"

          # 450 MiB
          LIMIT=$((450 * 1024 * 1024))

          if [ "$SIZE" -le "$LIMIT" ]; then
            cp vendor.img.tar.gz vendor.img.tar.gz.part-00
          else
            split \
              -b "$ARTIFACT_CHUNK_SIZE" \
              -d \
              -a 3 \
              vendor.img.tar.gz \
              vendor.img.tar.gz.part-

            rm -f vendor.img.tar.gz
          fi

          {
            echo "=== Artifact package ==="
            ls -lh

            echo
            echo "=== Individual artifact sizes ==="

            find . \
              -maxdepth 1 \
              -type f \
              -printf '%f %s bytes\n' \
              | sort

            echo
            echo "=== Maximum allowed individual part ==="
            echo "$LIMIT bytes"

          } | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/18-artifact-size-check.txt"

          # Hard fail if any artifact part exceeds 450 MiB.
          while IFS= read -r file; do
            bytes="$(stat -c '%s' "$file")"

            if [ "$bytes" -gt "$LIMIT" ]; then
              echo "::error::Artifact part exceeds 450 MiB: $file ($bytes bytes)"
              exit 1
            fi
          done < <(
            find . \
              -maxdepth 1 \
              -type f \
              -name 'vendor.img.tar.gz.part-*'
          )

      # ------------------------------------------------------------
      # V21 — Create extraction instructions
      # ------------------------------------------------------------
      - name: "V21 • Create artifact instructions"
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/vendor-result"

          cat > README-EXTRACT.txt <<'EOF'
          LG Velvet LM-G900 (G900EMW)
          Android 16 QPR2 / LineageOS 23.2
          Vendor.img build

          If vendor.img.tar.gz.part-00 is the only archive part:
              cat vendor.img.tar.gz.part-00 > vendor.img.tar.gz

          If multiple parts exist:
              cat vendor.img.tar.gz.part-* > vendor.img.tar.gz

          Then extract:
              tar -xzf vendor.img.tar.gz

          SHA256:
              sha256sum -c vendor.img.tar.gz.sha256

          The extracted file is:
              vendor.img

          This workflow intentionally uploads only the vendor result
          and diagnostics, not the complete Android build tree.
          EOF

      # ------------------------------------------------------------
      # V22 — Final diagnostics
      # ------------------------------------------------------------
      - name: "V22 • Final storage and result report"
        if: always()
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo "FINAL VENDOR BUILD REPORT"
            echo "========================================"

            echo
            echo "=== Runner disk ==="
            df -h

            echo
            echo "=== Result files ==="
            find "$GITHUB_WORKSPACE/vendor-result" \
              -maxdepth 1 \
              -type f \
              -exec ls -lh {} \; \
              2>/dev/null

            echo
            echo "=== Diagnostics ==="
            du -sh "$GITHUB_WORKSPACE/ci-diagnostics" 2>/dev/null || true

          } | tee \
            "$GITHUB_WORKSPACE/ci-diagnostics/vendor/99-final-report.txt"

      # ------------------------------------------------------------
      # V23 — Upload vendor result ALWAYS
      # ------------------------------------------------------------
      - name: "V23 • Upload vendor result"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-G900EMW-VENDOR-${{ github.run_id }}"
          path: |
            vendor-result/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

      # ------------------------------------------------------------
      # V24 — Upload diagnostics ALWAYS
      # ------------------------------------------------------------
      - name: "V24 • Upload build logs ALWAYS"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LM-G900-G900EMW-VENDOR-LOGS-${{ github.run_id }}"
          path: |
            ci-diagnostics/vendor/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      # ------------------------------------------------------------
      # V25 — Cleanup only after artifacts have been uploaded
      # ------------------------------------------------------------
      - name: "V25 • Cleanup temporary Android source"
        if: always()
        shell: bash
        run: |
          set +e

          rm -rf "$RUNNER_TEMP/android"
          rm -rf "$RUNNER_TEMP/bin"

          echo "Temporary Android source removed."
          df -h
