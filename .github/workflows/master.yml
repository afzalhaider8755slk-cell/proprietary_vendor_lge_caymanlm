name: CaymanLM Vendor IMG - LineageOS 23.2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVICE: caymanlm
  LINEAGE_VERSION: lineage-23.2
  ANDROID_VERSION: android-16
  VENDOR_BRANCH: sixteen

jobs:
  build-vendor:
    name: Build vendor.img
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout vendor tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------
      # 2. Initial runner diagnostics
      # ---------------------------------------------------------
      - name: Runner diagnostics
        run: |
          mkdir -p logs

          {
            echo "=========================================="
            echo "CAYMANLM VENDOR BUILD"
            echo "LineageOS 23.2 / Android 16 QPR2"
            echo "=========================================="
            date
            echo

            echo "=== CPU ==="
            nproc
            lscpu || true
            echo

            echo "=== MEMORY ==="
            free -h
            echo

            echo "=== DISK ==="
            df -h
            echo

            echo "=== WORKSPACE ==="
            du -sh .
          } 2>&1 | tee logs/runner.log

      # ---------------------------------------------------------
      # 3. Validate vendor source
      # ---------------------------------------------------------
      - name: Validate vendor source
        run: |
          set -Eeuo pipefail

          {
            echo "=== Vendor source validation ==="

            test -d proprietary/vendor

            echo "Vendor directory:"
            du -sh proprietary/vendor

            echo
            echo "File count:"
            find proprietary/vendor -type f | wc -l

            echo
            echo "Top-level:"
            find proprietary/vendor -maxdepth 2 -type d | sort

            echo
            echo "Repository:"
            git remote -v || true

            echo
            echo "Commit:"
            git rev-parse HEAD

            echo
            echo "Branch:"
            git branch --show-current || true
          } 2>&1 | tee logs/source-validation.log

      # ---------------------------------------------------------
      # 4. Install only required packages
      # ---------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail

          {
            sudo apt-get update

            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              e2fsprogs \
              rsync \
              file \
              git \
              python3 \
              unzip \
              zip \
              gzip \
              tar \
              xz-utils \
              zstd \
              lz4
          } 2>&1 | tee logs/packages.log

      # ---------------------------------------------------------
      # 5. Feature audit
      # ---------------------------------------------------------
      - name: Audit required hardware features
        run: |
          set +e

          {
            echo "=========================================="
            echo "REQUIRED HARDWARE FEATURE AUDIT"
            echo "=========================================="
            echo

            audit_feature() {
              NAME="$1"
              PATTERN="$2"

              echo
              echo "===== $NAME ====="

              COUNT=$(find proprietary/vendor -type f \
                | grep -Ei "$PATTERN" \
                | wc -l)

              echo "Matching files: $COUNT"

              find proprietary/vendor -type f \
                | grep -Ei "$PATTERN" \
                | sort | head -100
            }

            audit_feature \
              "FINGERPRINT" \
              'finger|fps|biometric|goodix|fpc|synaptics'

            audit_feature \
              "VIBRATION / HAPTICS" \
              'vibrat|haptic|motor|linear_motor'

            audit_feature \
              "DUAL-SIM / RIL" \
              'ril|qcril|radio|modem|uim|sim|telephony'

            audit_feature \
              "AUDIO" \
              'audio|acdb|adsp|snd|sound|codec'

            audit_feature \
              "IMS / VoLTE" \
              'ims|volte|qti.*ims'

            audit_feature \
              "WIFI / VoWiFi" \
              'wifi|wlan|wpa|hostapd|vowifi|wifi.*call'

            echo
            echo "===== VINTF / MANIFEST ====="

            find proprietary/vendor -type f \
              | grep -Ei \
              'manifest.*xml|compatibility.*xml|vintf' \
              | sort

          } 2>&1 | tee logs/feature-audit.log

      # ---------------------------------------------------------
      # 6. Prepare isolated build directory
      # ---------------------------------------------------------
      - name: Prepare build tree
        run: |
          set -Eeuo pipefail

          {
            rm -rf work
            mkdir -p work/vendor

            rsync -a \
              proprietary/vendor/ \
              work/vendor/

            echo "Copied vendor:"
            du -sh work/vendor

            echo "Files:"
            find work/vendor -type f | wc -l

          } 2>&1 | tee logs/prepare.log

      # ---------------------------------------------------------
      # 7. Calculate image size
      # ---------------------------------------------------------
      - name: Calculate vendor image size
        run: |
          set -Eeuo pipefail

          {
            USED_KB=$(du -sk work/vendor | awk '{print $1}')

            # 256 MiB filesystem headroom
            HEADROOM_KB=$((256 * 1024))

            IMAGE_KB=$((USED_KB + HEADROOM_KB))

            # Round up to 4 MiB
            IMAGE_KB=$(
              ((IMAGE_KB + 4095) / 4096) * 4096
            )

            echo "Vendor used: ${USED_KB} KB"
            echo "Headroom: ${HEADROOM_KB} KB"
            echo "Image size: ${IMAGE_KB} KB"

            echo "IMAGE_KB=${IMAGE_KB}" >> "$GITHUB_ENV"

          } 2>&1 | tee logs/image-size.log

      # ---------------------------------------------------------
      # 8. Build vendor.img
      # ---------------------------------------------------------
      - name: Build vendor.img
        run: |
          set -Eeuo pipefail

          {
            echo "=========================================="
            echo "BUILDING vendor.img"
            echo "=========================================="

            rm -f vendor.img

            echo
            echo "Creating EXT4 filesystem..."

            mke2fs \
              -t ext4 \
              -b 4096 \
              -m 0 \
              -O ^has_journal \
              -L vendor \
              vendor.img \
              "${IMAGE_KB}K"

            echo
            echo "Mounting image..."

            mkdir -p image/mnt

            sudo mount \
              -o loop \
              vendor.img \
              image/mnt

            echo
            echo "Copying vendor files..."

            sudo rsync -aHAX \
              work/vendor/ \
              image/mnt/

            echo
            echo "Sync..."

            sudo sync

            echo
            echo "Unmount..."

            sudo umount image/mnt

            echo
            echo "Filesystem check..."

            e2fsck -fy vendor.img

            echo
            echo "=== FINAL IMAGE ==="

            ls -lh vendor.img
            file vendor.img
            du -h vendor.img

          } 2>&1 | tee logs/vendor-build.log

      # ---------------------------------------------------------
      # 9. Verify image contents
      # ---------------------------------------------------------
      - name: Verify vendor.img
        run: |
          set -Eeuo pipefail

          {
            echo "=========================================="
            echo "VENDOR IMAGE VERIFICATION"
            echo "=========================================="

            mkdir -p verify/mnt

            sudo mount \
              -o loop,ro \
              vendor.img \
              verify/mnt

            echo
            echo "Image root:"
            sudo ls -lah verify/mnt

            echo
            echo "Vendor file count:"
            sudo find verify/mnt -type f | wc -l

            echo
            echo "Required feature verification:"

            for item in \
              "Fingerprint|finger|fps|biometric" \
              "Vibration|vibrat|haptic|motor" \
              "Dual-SIM_RIL|ril|qcril|radio|modem|sim" \
              "Audio|audio|acdb|adsp|sound" \
              "IMS|ims|volte" \
              "WiFi_VoWiFi|wifi|wlan|vowifi"; do

              NAME="${item%%|*}"
              PATTERN="${item#*|}"

              COUNT=$(sudo find verify/mnt -type f \
                | grep -Ei "$PATTERN" \
                | wc -l || true)

              echo "$NAME -> $COUNT matching files"
            done

            echo
            echo "Filesystem:"
            df -h verify/mnt

            sudo umount verify/mnt

            echo
            echo "Final filesystem test:"
            e2fsck -fn vendor.img

          } 2>&1 | tee logs/verification.log

      # ---------------------------------------------------------
      # 10. Package vendor image
      # ---------------------------------------------------------
      - name: Package vendor.img
        run: |
          set -Eeuo pipefail

          {
            mkdir -p output

            cp vendor.img \
              output/vendor.img

            echo "Creating tar.gz..."

            tar -C output \
              -czf vendor-caymanlm-lineage23.2.tar.gz \
              vendor.img

            echo
            echo "Creating checksums..."

            sha256sum \
              output/vendor.img \
              > output/vendor.img.sha256

            sha256sum \
              output/vendor-caymanlm-lineage23.2.tar.gz \
              > output/vendor-caymanlm-lineage23.2.tar.gz.sha256

            echo
            echo "=== OUTPUT ==="

            ls -lh output/

          } 2>&1 | tee logs/package.log

      # ---------------------------------------------------------
      # 11. Storage audit
      # ---------------------------------------------------------
      - name: Final storage audit
        if: always()
        run: |
          {
            echo "=== FINAL DISK ==="
            df -h

            echo
            echo "=== WORKSPACE SIZE ==="
            du -sh . || true

            echo
            echo "=== OUTPUT ==="
            ls -lah output 2>/dev/null || true

          } 2>&1 | tee logs/final-storage.log

      # ---------------------------------------------------------
      # 12. SUCCESS ARTIFACT
      # ---------------------------------------------------------
      - name: Upload vendor package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caymanlm-vendor-lineage23.2
          path: |
            output/vendor-caymanlm-lineage23.2.tar.gz
            output/vendor-caymanlm-lineage23.2.tar.gz.sha256
            output/vendor.img.sha256
            logs/feature-audit.log
            logs/verification.log
            logs/final-storage.log
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      # ---------------------------------------------------------
      # 13. RAW IMAGE ONLY IF IT IS <= 500 MiB
      # ---------------------------------------------------------
      - name: Check raw image size
        if: success()
        run: |
          set -Eeuo pipefail

          SIZE=$(stat -c%s output/vendor.img)
          LIMIT=$((500 * 1024 * 1024))

          echo "vendor.img size: $SIZE bytes"
          echo "500 MiB limit:   $LIMIT bytes"

          if [ "$SIZE" -le "$LIMIT" ]; then
            echo "RAW_OK=true" >> "$GITHUB_ENV"
            echo "Raw image is within 500 MiB."
          else
            echo "RAW_OK=false" >> "$GITHUB_ENV"
            echo "Raw image exceeds 500 MiB."
            echo "Compressed tar.gz is the primary artifact."
          fi

      - name: Upload raw vendor.img
        if: success() && env.RAW_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: caymanlm-vendor-img
          path: output/vendor.img
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      # ---------------------------------------------------------
      # 14. FAILURE LOGS
      # ---------------------------------------------------------
      - name: Collect failure diagnostics
        if: failure()
        run: |
          set +e

          mkdir -p failure-logs

          echo "==========================================" \
            > failure-logs/FAILURE.txt

          echo "CAYMANLM VENDOR BUILD FAILED" \
            >> failure-logs/FAILURE.txt

          date >> failure-logs/FAILURE.txt

          echo >> failure-logs/FAILURE.txt
          echo "=== DISK ===" >> failure-logs/FAILURE.txt
          df -h >> failure-logs/FAILURE.txt

          echo >> failure-logs/FAILURE.txt
          echo "=== MEMORY ===" >> failure-logs/FAILURE.txt
          free -h >> failure-logs/FAILURE.txt

          echo >> failure-logs/FAILURE.txt
          echo "=== CPU ===" >> failure-logs/FAILURE.txt
          nproc >> failure-logs/FAILURE.txt

          echo >> failure-logs/FAILURE.txt
          echo "=== FILESYSTEM ===" >> failure-logs/FAILURE.txt
          mount >> failure-logs/FAILURE.txt

          cp -r logs/* failure-logs/ 2>/dev/null || true

          find . \
            -maxdepth 3 \
            -type f \
            -name '*.log' \
            -print \
            >> failure-logs/FAILURE.txt 2>/dev/null || true

          echo
          echo "Failure diagnostics collected."

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: caymanlm-vendor-build-failure-logs
          path: failure-logs/
          compression-level: 9
          retention-days: 14
          if-no-files-found: warn
