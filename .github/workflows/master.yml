name: Build LG CaymanLM Android 16 QPR2 Vendor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caymanlm-vendor-build
  cancel-in-progress: true

env:
  ANDROID_BRANCH: android16-qpr2-release
  VENDOR_REPO: https://github.com/afzalhaider8755slk-cell/proprietary_vendor_lge_caymanlm.git
  VENDOR_PATH: vendor/lge/caymanlm
  DEVICE_CODENAME: caymanlm

jobs:
  build-vendor:
    name: Build vendor.img
    runs-on: ubuntu-24.04

    timeout-minutes: 360

    steps:

      # ---------------------------------------------------------
      # 1. Runner sanity check
      # ---------------------------------------------------------
      - name: Check runner resources
        shell: bash
        run: |
          set -e

          echo "===== CPU ====="
          nproc

          echo "===== MEMORY ====="
          free -h

          echo "===== DISK ====="
          df -h /

          echo "===== ARCH ====="
          uname -m

          AVAIL_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')

          echo "Available disk: ${AVAIL_GB} GB"

          # A full Android vendor build is not realistic on the
          # standard 14-GB GitHub runner.
          if [ "${AVAIL_GB}" -lt 60 ]; then
            echo "::error::Insufficient runner disk space."
            echo "::error::At least ~60 GB free disk is required for this workflow."
            echo "::error::Use a GitHub larger Ubuntu runner or self-hosted runner."
            exit 1
          fi

      # ---------------------------------------------------------
      # 2. Install host dependencies
      # ---------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            git-lfs \
            curl \
            wget \
            rsync \
            unzip \
            zip \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            g++-multilib \
            gcc-multilib \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev \
            e2fsprogs \
            erofs-utils

      # ---------------------------------------------------------
      # 3. Configure Git
      # ---------------------------------------------------------
      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "CaymanLM Vendor Builder"
          git config --global user.email "actions@github.com"
          git config --global protocol.version 2

      # ---------------------------------------------------------
      # 4. Install repo
      # ---------------------------------------------------------
      - name: Install repo tool
        shell: bash
        run: |
          set -eux

          mkdir -p "${HOME}/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          repo --version

      # ---------------------------------------------------------
      # 5. Prepare Android source tree
      # ---------------------------------------------------------
      - name: Initialize Android 16 QPR2
        shell: bash
        run: |
          set -eux

          mkdir -p "${GITHUB_WORKSPACE}/android"

          cd "${GITHUB_WORKSPACE}/android"

          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b "${ANDROID_BRANCH}" \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none \
            --no-repo-verify

      # ---------------------------------------------------------
      # 6. Sync Android source
      # ---------------------------------------------------------
      - name: Sync Android source
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          repo sync \
            -c \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            --no-clone-bundle \
            --no-use-superproject \
            -j"$(nproc)"

      # ---------------------------------------------------------
      # 7. Import CaymanLM vendor tree
      # ---------------------------------------------------------
      - name: Clone CaymanLM vendor
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          mkdir -p vendor/lge

          git clone \
            --depth=1 \
            --single-branch \
            "${VENDOR_REPO}" \
            "${VENDOR_PATH}"

          echo "===== Vendor tree ====="
          du -sh "${VENDOR_PATH}"
          find "${VENDOR_PATH}/proprietary" -type f | wc -l

      # ---------------------------------------------------------
      # 8. Verify vendor source
      # ---------------------------------------------------------
      - name: Verify vendor blobs
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/android"

          test -f "${VENDOR_PATH}/Android.bp"
          test -f "${VENDOR_PATH}/caymanlm-vendor.mk"
          test -d "${VENDOR_PATH}/proprietary/vendor"

          COUNT=$(find "${VENDOR_PATH}/proprietary/vendor" -type f | wc -l)

          echo "Vendor files: ${COUNT}"

          if [ "${COUNT}" -lt 600 ]; then
            echo "::error::Vendor blob count unexpectedly low."
            exit 1
          fi

      # ---------------------------------------------------------
      # 9. Create CaymanLM device configuration
      # ---------------------------------------------------------
      - name: Create CaymanLM device tree
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          mkdir -p device/lge/caymanlm

          cat > device/lge/caymanlm/AndroidProducts.mk <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/caymanlm.mk
          EOF

          cat > device/lge/caymanlm/caymanlm.mk <<'EOF'
          PRODUCT_NAME := caymanlm
          PRODUCT_DEVICE := caymanlm
          PRODUCT_BRAND := lge
          PRODUCT_MODEL := LM-G900
          PRODUCT_MANUFACTURER := LGE

          PRODUCT_SOONG_NAMESPACES += \
              vendor/lge/caymanlm

          $(call inherit-product, vendor/lge/caymanlm/caymanlm-vendor.mk)
          EOF

          cat > device/lge/caymanlm/BoardConfig.mk <<'EOF'
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_ABI2 :=

          TARGET_2ND_ARCH :=
          TARGET_2ND_ARCH_VARIANT :=
          TARGET_2ND_CPU_ABI :=
          TARGET_2ND_CPU_ABI2 :=

          BOARD_VNDK_VERSION := current

          TARGET_NO_KERNEL := true

          BOARD_BUILD_SYSTEM_ROOT_IMAGE := false

          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4
          BOARD_VENDORIMAGE_PARTITION_SIZE := 1073741824

          BOARD_FLASH_BLOCK_SIZE := 4096

          TARGET_COPY_OUT_VENDOR := vendor
          EOF

          cat > device/lge/caymanlm/BoardConfigVendor.mk <<'EOF'
          # CaymanLM vendor configuration
          EOF

          cat > device/lge/caymanlm/device.mk <<'EOF'
          PRODUCT_SOONG_NAMESPACES += \
              vendor/lge/caymanlm

          $(call inherit-product, vendor/lge/caymanlm/caymanlm-vendor.mk)
          EOF

      # ---------------------------------------------------------
      # 10. Validate generated configuration
      # ---------------------------------------------------------
      - name: Validate device configuration
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          test -f device/lge/caymanlm/BoardConfig.mk
          test -f device/lge/caymanlm/caymanlm.mk
          test -f device/lge/caymanlm/device.mk

          grep -q "PRODUCT_NAME := caymanlm" \
            device/lge/caymanlm/caymanlm.mk

          grep -q "PRODUCT_SOONG_NAMESPACES" \
            device/lge/caymanlm/caymanlm.mk

      # ---------------------------------------------------------
      # 11. Setup Android build environment
      # ---------------------------------------------------------
      - name: Setup Android build environment
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          source build/envsetup.sh

          lunch caymanlm-userdebug

      # ---------------------------------------------------------
      # 12. Build vendor image only
      # ---------------------------------------------------------
      - name: Build vendor image
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          source build/envsetup.sh
          lunch caymanlm-userdebug

          m vendorimage -j"$(nproc)"

      # ---------------------------------------------------------
      # 13. Locate output
      # ---------------------------------------------------------
      - name: Locate vendor.img
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          find out/target/product/caymanlm \
            -maxdepth 2 \
            -type f \
            -name "vendor.img" \
            -print

          test -f out/target/product/caymanlm/vendor.img

      # ---------------------------------------------------------
      # 14. Validate image
      # ---------------------------------------------------------
      - name: Validate vendor.img
        shell: bash
        run: |
          set -eux

          cd "${GITHUB_WORKSPACE}/android"

          IMG="out/target/product/caymanlm/vendor.img"

          echo "===== vendor.img ====="
          ls -lh "${IMG}"
          file "${IMG}"

          echo "===== SHA256 ====="
          sha256sum "${IMG}"

          echo "===== Filesystem ====="
          blkid "${IMG}" || true

          e2fsck -fn "${IMG}" || true

      # ---------------------------------------------------------
      # 15. Prepare artifact
      # ---------------------------------------------------------
      - name: Prepare artifact
        shell: bash
        run: |
          set -eux

          mkdir -p "${GITHUB_WORKSPACE}/artifact"

          cp \
            "${GITHUB_WORKSPACE}/android/out/target/product/caymanlm/vendor.img" \
            "${GITHUB_WORKSPACE}/artifact/vendor.img"

          cd "${GITHUB_WORKSPACE}/artifact"

          sha256sum vendor.img > vendor.img.sha256

          du -sh .

          ls -lh

      # ---------------------------------------------------------
      # 16. Upload ONLY final vendor image
      # ---------------------------------------------------------
      - name: Upload vendor.img
        uses: actions/upload-artifact@v4
        with:
          name: caymanlm-android16-qpr2-vendor
          path: |
            artifact/vendor.img
            artifact/vendor.img.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      # ---------------------------------------------------------
      # 17. Cleanup large build output
      # ---------------------------------------------------------
      - name: Cleanup build workspace
        if: always()
        shell: bash
        run: |
          rm -rf "${GITHUB_WORKSPACE}/android/out" || true

          echo "===== Final disk usage ====="
          df -h /
