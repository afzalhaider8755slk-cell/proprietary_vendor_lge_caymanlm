name: LM-G900 Android 16 QPR2 - Vendor Build FIXED v27 LOW-STORAGE

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# IMPORTANT:
# - Full CURRENT SOURCE is intentionally kept; Git history is limited to depth 1
#   to fit the available runner storage. No source tree is removed.
# - The sync is split into network-only and local-only phases.
# - Transient Git/repo fetch failures are retried by repo itself and by the workflow.
# - No destructive project deletion is performed on a failed sync.
# - The workflow cannot guarantee that GitHub infrastructure will never lose a runner,
#   but it is designed to prevent ordinary/transient repo-sync failures from killing V04.

env:
  MANIFEST_URL: "https://github.com/LineageOS/android.git"
  ANDROID_BRANCH: "lineage-23.2"

  DEVICE_CODENAME: "caymanlm"
  MODEL: "LM-G900"
  PRODUCT: "lineage_caymanlm-userdebug"

  VENDOR_ORG: "lge-qcom-dev"
  DEVICE_REPO: "android_device_lge_caymanlm"
  VENDOR_REPO: "proprietary_vendor_lge_caymanlm"
  COMMON_VENDOR_REPO: "proprietary_vendor_lge_sm7250-common"

  DIAG_DIR: "ci-diagnostics/vendor"

  # Conservative values are intentional for a large Android source checkout.
  REPO_JOBS: "1"
  REPO_NETWORK_JOBS: "1"
  REPO_CHECKOUT_JOBS: "1"
  REPO_RETRY_FETCHES: "10"
  REPO_SYNC_ATTEMPTS: "6"
  REPO_DEPTH: "1"
  BUILD_JOBS: "1"

  # Low-storage policy for the user's ~145 GiB runner.
  # These are safety thresholds, NOT a 400 GiB hard requirement.
  # The workflow cleans first, then measures the real available space.
  # Full current source is retained; Git history is depth-1 and .repo is
  # removed only after the exact pinned manifest is saved.
  MIN_FREE_AFTER_CLEANUP_GB: "70"
  MIN_FREE_AFTER_SYNC_GB: "25"
  MIN_FREE_BEFORE_BUILD_GB: "20"

jobs:
  vendor:
    name: LM-G900 Vendor Build - Full Source / Stable Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # V00 - CHECKOUT
      # ============================================================
      - name: V00 - Checkout repository
        id: v00
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      # ============================================================
      # V00.1 - EARLY STORAGE / MEMORY CHECK
      # ============================================================
      - name: V00.1 - Check runner resources
        id: storage_before
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/$DIAG_DIR" "$GITHUB_WORKSPACE/vendor_out"

          echo "=================================================="
          echo "LM-G900 RUNNER RESOURCE CHECK"
          echo "=================================================="
          echo "runner=${RUNNER_NAME}"
          echo "os=$(uname -a)"
          echo "cpu=$(nproc)"
          echo "memory="
          free -h || true
          echo
          df -h
          echo
          df -ih

          root_avail_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          root_avail_gb="$((root_avail_kb / 1024 / 1024))"
          echo "root_available_before_cleanup_gb=$root_avail_gb"

          {
            echo "root_available_before_cleanup_gb=$root_avail_gb"
            echo "cleanup_threshold_gb=$MIN_FREE_AFTER_CLEANUP_GB"
            echo "cpu=$(nproc)"
            free -m | awk 'NR==2 {print "mem_total_mb=" $2; print "mem_available_mb=" $7}'
          } > "$GITHUB_WORKSPACE/$DIAG_DIR/00-resource-summary.log"

          echo "INFO: no 400 GiB hard gate is used here. Safe cleanup runs next, then the real post-cleanup capacity is evaluated."

      # ============================================================
      # V00.2 - SAFE CLEANUP
      # ============================================================
      - name: V00.2 - Free runner storage safely
        id: cleanup
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=================================================="
          echo "SAFE RUNNER CLEANUP"
          echo "=================================================="

          # Do NOT delete system Python, hosted tool cache, or other runtime files.
          # Those can destabilize GitHub Actions itself.

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true

          # Safe space recovery on a disposable GitHub-hosted VM. Do NOT remove
          # /opt/hostedtoolcache or system Python/Node runtimes. Actions still need them.
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/share/powershell 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true

          docker system prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true

          rm -rf ~/.cache/* 2>/dev/null || true
          rm -rf ~/.gradle/caches/* 2>/dev/null || true
          rm -rf ~/.npm/_cacache 2>/dev/null || true
          rm -rf ~/.m2/repository/* 2>/dev/null || true
          rm -rf ~/.cache/pip 2>/dev/null || true
          rm -rf ~/.ccache 2>/dev/null || true

          sudo find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          sudo find /var/tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true

          sync

          echo "=================================================="
          echo "STORAGE AFTER SAFE CLEANUP"
          echo "=================================================="
          df -h
          df -ih

          root_after_cleanup_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          root_after_cleanup_gb="$((root_after_cleanup_kb / 1024 / 1024))"
          echo "root_available_after_cleanup_gb=$root_after_cleanup_gb"

          {
            echo "root_available_after_cleanup_gb=$root_after_cleanup_gb"
            echo "minimum_safe_after_cleanup_gb=$MIN_FREE_AFTER_CLEANUP_GB"
          } >> "$GITHUB_WORKSPACE/$DIAG_DIR/00-resource-summary.log"

          if (( root_after_cleanup_gb < MIN_FREE_AFTER_CLEANUP_GB )); then
            echo "FATAL: even after safe cleanup, there is not enough free workspace for a reliable full-source sync/build."
            echo "Available=${root_after_cleanup_gb} GiB; minimum=${MIN_FREE_AFTER_CLEANUP_GB} GiB."
            exit 1
          fi

      # ============================================================
      # V00.3 - CREATE DIAGNOSTICS
      # ============================================================
      - name: V00.3 - Create diagnostics
        id: diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/$DIAG_DIR" \
            "$GITHUB_WORKSPACE/vendor_out"

          {
            echo "LG Velvet LM-G900 - VENDOR ONLY FIXED v27 LOW-STORAGE"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "model=$MODEL"
            echo "codename=$DEVICE_CODENAME"
            echo "product=$PRODUCT"
            echo "android_branch=$ANDROID_BRANCH"
            echo "runner=$RUNNER_NAME"
            echo "started=$(date -u +%FT%TZ)"
          } | tee "$GITHUB_WORKSPACE/$DIAG_DIR/00-run.log"

      # ============================================================
      # V01 - DEPENDENCIES
      # ============================================================
      - name: V01 - Install build dependencies and update repo
        id: v01
        shell: bash
        run: |
          set -Eeuo pipefail

          log="$GITHUB_WORKSPACE/$DIAG_DIR/01-dependencies.log"
          exec > >(tee -a "$log") 2>&1

          sudo apt-get update
          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zstd \
            unzip \
            rsync \
            bc \
            ccache \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-pip \
            jq \
            lz4 \
            liblz4-tool \
            libxml2-utils \
            xsltproc \
            fontconfig

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          # Download repo launcher and verify that it is executable.
          curl -fL --retry 8 --retry-all-errors --retry-delay 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/repo"
          chmod +x "$HOME/repo"
          sudo install -m 0755 "$HOME/repo" /usr/local/bin/repo

          git --version
          repo --version
          python3 --version

          echo "Storage after dependencies:"
          df -h

      # ============================================================
      # V02 - INIT AND REPO TOOL
      # ============================================================
      - name: V02 - Initialize Android source and update repo tool
        id: v02
        shell: bash
        run: |
          set -Eeuo pipefail

          base="$GITHUB_WORKSPACE"
          log="$base/$DIAG_DIR/02-repo-init.log"
          exec > >(tee -a "$log") 2>&1

          rm -rf "$base/android"
          mkdir -p "$base/android"
          cd "$base/android"

          repo init \
            -u "$MANIFEST_URL" \
            -b "$ANDROID_BRANCH" \
            --current-branch \
            --depth="$REPO_DEPTH" \
            --no-tags \
            --no-clone-bundle \
            --repo-url=https://gerrit.googlesource.com/git-repo \
            --repo-branch=stable

          echo "Running repo selfupdate..."
          repo selfupdate

          test -s "$base/android/.repo/manifests/default.xml"
          repo version

          echo "V02 PASS: repo initialized and selfupdated."
          df -h

      # ============================================================
      # V03 - REAL LM-G900 REPOSITORIES
      # ============================================================
      - name: V03 - Resolve REAL LM-G900 vendor repositories
        id: v03
        shell: bash
        run: |
          set -Eeuo pipefail

          base="$GITHUB_WORKSPACE"
          log="$base/$DIAG_DIR/03-vendor-manifest.log"
          exec > >(tee -a "$log") 2>&1

          cd "$base/android"
          mkdir -p .repo/local_manifests

          DEVICE_URL="https://github.com/${VENDOR_ORG}/${DEVICE_REPO}.git"
          VENDOR_URL="https://github.com/${VENDOR_ORG}/${VENDOR_REPO}.git"
          COMMON_URL="https://github.com/${VENDOR_ORG}/${COMMON_VENDOR_REPO}.git"

          echo "=== repository existence ==="
          git ls-remote --exit-code --heads "$DEVICE_URL" >/dev/null
          git ls-remote --exit-code --heads "$VENDOR_URL" >/dev/null
          git ls-remote --exit-code --heads "$COMMON_URL" >/dev/null

          resolve_branch() {
            local url="$1"
            local preferred="$2"
            local result=""

            if git ls-remote --exit-code --heads "$url" "$preferred" >/dev/null 2>&1; then
              result="$preferred"
            elif git ls-remote --exit-code --heads "$url" "lineage-22.2" >/dev/null 2>&1; then
              result="lineage-22.2"
            else
              result="$(git ls-remote --symref "$url" HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')"
            fi

            test -n "$result"
            printf '%s' "$result"
          }

          DEVICE_BRANCH="$(resolve_branch "$DEVICE_URL" "$ANDROID_BRANCH")"
          VENDOR_BRANCH="$(resolve_branch "$VENDOR_URL" "$ANDROID_BRANCH")"
          COMMON_BRANCH="$(resolve_branch "$COMMON_URL" "$ANDROID_BRANCH")"

          echo "DEVICE_BRANCH=$DEVICE_BRANCH"
          echo "VENDOR_BRANCH=$VENDOR_BRANCH"
          echo "COMMON_BRANCH=$COMMON_BRANCH"

          {
            echo "DEVICE_BRANCH=$DEVICE_BRANCH"
            echo "VENDOR_BRANCH=$VENDOR_BRANCH"
            echo "COMMON_BRANCH=$COMMON_BRANCH"
          } >> "$GITHUB_ENV"

          cat > .repo/local_manifests/g900lm.xml <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="g900github" fetch="https://github.com/" />
            <project name="${VENDOR_ORG}/${DEVICE_REPO}" path="device/lge/caymanlm" remote="g900github" revision="${DEVICE_BRANCH}" />
            <project name="${VENDOR_ORG}/${VENDOR_REPO}" path="vendor/lge/caymanlm" remote="g900github" revision="${VENDOR_BRANCH}" />
            <project name="${VENDOR_ORG}/${COMMON_VENDOR_REPO}" path="vendor/lge/sm7250-common" remote="g900github" revision="${COMMON_BRANCH}" />
          </manifest>
          EOF2

          cat .repo/local_manifests/g900lm.xml
          repo manifest >/dev/null
          echo "V03 PASS: LM-G900 repositories and local manifest resolved."

      # ============================================================
      # V04 - FULL CURRENT-SOURCE REPO SYNC / LOW STORAGE
      # ============================================================
      - name: V04 - Full current source repo sync with network recovery
        id: v04
        shell: bash
        run: |
          set -Eeuo pipefail

          base="$GITHUB_WORKSPACE"
          ref_log="$base/$DIAG_DIR/04-ref-check.log"
          sync_log="$base/$DIAG_DIR/04-repo-sync.log"

          exec > >(tee -a "$ref_log") 2>&1

          check_ref() {
            local repo_name="$1"
            local branch="$2"
            local url="https://github.com/${VENDOR_ORG}/${repo_name}.git"
            echo "CHECK $url @ refs/heads/$branch"
            git ls-remote --exit-code --heads "$url" "$branch"
            echo "PASS $repo_name @ $branch"
          }

          check_ref "$DEVICE_REPO" "$DEVICE_BRANCH"
          check_ref "$VENDOR_REPO" "$VENDOR_BRANCH"
          check_ref "$COMMON_VENDOR_REPO" "$COMMON_BRANCH"

          cd "$base/android"

          # Stable Git transport settings for long HTTPS fetches.
          git config --global protocol.version 2
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 120
          git config --global fetch.parallel 1
          git config --global gc.auto 0

          echo "=================================================="
          echo "V04 FULL CURRENT-SOURCE SYNC"
          echo "DEPTH=$REPO_DEPTH (full current source tree; Git history intentionally limited)"
          echo "network jobs=$REPO_NETWORK_JOBS"
          echo "checkout jobs=$REPO_CHECKOUT_JOBS"
          echo "repo retry-fetches=$REPO_RETRY_FETCHES"
          echo "outer attempts=$REPO_SYNC_ATTEMPTS"
          echo "=================================================="

          df -h
          df -ih

          : > "$sync_log"

          # Phase A: NETWORK ONLY.
          # This isolates all Git/network activity from checkout work.
          # repo itself supports retry-fetches; the outer loop handles a failed
          # invocation and resumes from already fetched objects.
          attempt=1
          network_rc=1

          while (( attempt <= REPO_SYNC_ATTEMPTS )); do
            echo "==================================================" | tee -a "$sync_log"
            echo "NETWORK SYNC ATTEMPT $attempt/$REPO_SYNC_ATTEMPTS" | tee -a "$sync_log"
            echo "time=$(date -u +%FT%TZ)" | tee -a "$sync_log"
            echo "==================================================" | tee -a "$sync_log"

            set +e
            repo sync \
              --network-only \
              --current-branch \
              --force-sync \
              --no-clone-bundle \
              --no-tags \
              --optimized-fetch \
              --prune \
              --fail-fast \
              --retry-fetches="$REPO_RETRY_FETCHES" \
              --jobs="$REPO_JOBS" \
              --jobs-network="$REPO_NETWORK_JOBS" \
              --jobs-checkout="$REPO_CHECKOUT_JOBS" \
              --no-interleaved \
              2>&1 | tee -a "$sync_log"
            network_rc=${PIPESTATUS[0]}
            set -e

            echo "network_sync_exit=$network_rc" | tee -a "$sync_log"

            if (( network_rc == 0 )); then
              echo "NETWORK PHASE PASS" | tee -a "$sync_log"
              break
            fi

            if (( attempt < REPO_SYNC_ATTEMPTS )); then
              backoff=$((15 * attempt))
              echo "Transient/persistent sync error. Waiting ${backoff}s; existing objects will be reused." | tee -a "$sync_log"
              sleep "$backoff"
            fi
            attempt=$((attempt + 1))
          done

          if (( network_rc != 0 )); then
            echo "FATAL: network-only repo sync failed after $REPO_SYNC_ATTEMPTS attempts." | tee -a "$sync_log"
            exit "$network_rc"
          fi

          echo "==================================================" | tee -a "$sync_log"
          echo "PHASE B: LOCAL CHECKOUT" | tee -a "$sync_log"
          echo "==================================================" | tee -a "$sync_log"

          # Phase B: no network. If this fails, it is a local checkout problem,
          # not a runner/network problem.
          repo sync \
            --local-only \
            --current-branch \
            --force-sync \
            --no-tags \
            --prune \
            --jobs="$REPO_JOBS" \
            --jobs-checkout="$REPO_CHECKOUT_JOBS" \
            --no-interleaved \
            2>&1 | tee -a "$sync_log"

          local_rc=${PIPESTATUS[0]}
          echo "local_sync_exit=$local_rc" | tee -a "$sync_log"

          if (( local_rc != 0 )); then
            echo "FATAL: local checkout phase failed." | tee -a "$sync_log"
            exit "$local_rc"
          fi

          # Save the exact resolved manifest BEFORE deleting Git metadata.
          repo manifest -r > "$base/$DIAG_DIR/04-pinned-manifest.xml"

          echo "STORAGE IMMEDIATELY AFTER SOURCE CHECKOUT" | tee -a "$sync_log"
          df -h | tee -a "$sync_log"
          df -ih | tee -a "$sync_log"

          # The Android build consumes the working-tree source, not repo's Git
          # metadata. Remove ONLY .repo after the pinned manifest is saved;
          # NEVER remove device/vendor/source trees.
          echo "Removing repo Git metadata to reclaim storage; source tree stays intact." | tee -a "$sync_log"
          du -sh .repo 2>/dev/null | tee -a "$sync_log" || true
          rm -rf .repo 2>/dev/null || true

          echo "STORAGE AFTER REPO METADATA CLEANUP" | tee -a "$sync_log"
          df -h | tee -a "$sync_log"
          df -ih | tee -a "$sync_log"

          root_after_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          root_after_gb="$((root_after_kb / 1024 / 1024))"
          if (( root_after_gb < MIN_FREE_AFTER_SYNC_GB )); then
            echo "FATAL: not enough free space remains after source checkout/metadata cleanup." | tee -a "$sync_log"
            echo "Available=${root_after_gb} GiB; required=${MIN_FREE_AFTER_SYNC_GB} GiB." | tee -a "$sync_log"
            exit 1
          fi

          echo "==================================================" | tee -a "$sync_log"
          echo "V04 POST-SYNC INTEGRITY" | tee -a "$sync_log"
          echo "==================================================" | tee -a "$sync_log"

          find device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common -maxdepth 2 -type f | sort > "$base/$DIAG_DIR/04-required-source-files.txt"

          echo "STORAGE AFTER REPO SYNC" | tee -a "$sync_log"
          df -h | tee -a "$sync_log"
          df -ih | tee -a "$sync_log"

          echo "V04 PASS: full current source repo sync and local checkout completed."

      # ============================================================
      # V05 - VERIFY SYNCED SOURCE
      # ============================================================
      - name: V05 - Verify synced vendor source
        id: v05
        if: ${{ steps.v04.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/05-source-verification.log"
          exec > >(tee -a "$log") 2>&1

          echo "=== REQUIRED PROJECTS ==="
          test -d device/lge/caymanlm
          test -d vendor/lge/caymanlm
          test -d vendor/lge/sm7250-common
          printf '%s\n' \
            'device/lge/caymanlm' \
            'vendor/lge/caymanlm' \
            'vendor/lge/sm7250-common' > "$GITHUB_WORKSPACE/$DIAG_DIR/05-required-projects.txt"

          test -d device/lge/caymanlm

          echo "=== PINNED MANIFEST SAVED BY V04 ==="
          test -s "$GITHUB_WORKSPACE/$DIAG_DIR/04-pinned-manifest.xml"
          sed -n '1,80p' "$GITHUB_WORKSPACE/$DIAG_DIR/04-pinned-manifest.xml"

          echo "V05 PASS"

      # ============================================================
      # V06 - LM-G900 IDENTITY
      # ============================================================
      - name: V06 - Verify LM-G900 identity
        id: v06
        if: ${{ steps.v05.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/06-model-identity.log"
          exec > >(tee -a "$log") 2>&1

          echo "MODEL=$MODEL"
          echo "CODENAME=$DEVICE_CODENAME"
          echo "PRODUCT=$PRODUCT"

          grep -RniE 'LM-G900|caymanlm' \
            device/lge/caymanlm \
            vendor/lge/caymanlm \
            vendor/lge/sm7250-common \
            2>/dev/null | head -300 || true

          echo "V06 PASS"

      # ============================================================
      # V07 - BUILD ENVIRONMENT
      # ============================================================
      - name: V07 - Prepare vendor build environment
        id: v07
        if: ${{ steps.v06.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/07-product-config.log"
          exec > >(tee -a "$log") 2>&1

          source build/envsetup.sh
          lunch "$PRODUCT"

          echo "PRODUCT_DEVICE=$(get_build_var PRODUCT_DEVICE)"
          echo "TARGET_PRODUCT=$(get_build_var TARGET_PRODUCT)"
          echo "TARGET_BUILD_VARIANT=$(get_build_var TARGET_BUILD_VARIANT)"
          echo "V07 PASS"

      # ============================================================
      # V08 - HARDWARE AUDIT
      # ============================================================
      - name: V08 - Mandatory hardware integration audit
        id: v08
        if: ${{ steps.v07.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/08-hardware-audit.log"
          : > "$log"

          audit() {
            local label="$1"
            local pattern="$2"
            shift 2
            echo "=== $label ===" | tee -a "$log"
            if grep -RniE "$pattern" "$@" >> "$log" 2>&1; then
              echo "PASS: $label" | tee -a "$log"
            else
              echo "FAIL: $label" | tee -a "$log"
              return 1
            fi
          }

          audit "Fingerprint" 'fingerprint|fpc|goodix|biometric' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common
          audit "Vibration / haptics" 'vibrator|haptics|ff-memless|timed_output' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common
          audit "Dual-SIM / DSDS" 'dual.?sim|dsds|simslot|sim.?slot|multisim' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common
          audit "Audio" 'mixer_paths|audio_policy|audio_hw|primary\.sm|tinyalsa|snd' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common
          audit "Wi-Fi Calling / VoWiFi / IMS" 'ims|iwlan|vowifi|wifi.?calling|volte|carrier.?config' \
            device/lge/caymanlm vendor/lge/caymanlm vendor/lge/sm7250-common

          echo "V08 PASS"

      # ============================================================
      # V09 - BUILD VENDOR.IMG ONLY
      # ============================================================
      - name: V09 - Build vendor.img ONLY
        id: v09
        if: ${{ steps.v08.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-build.log"
          exec > >(tee -a "$log") 2>&1

          source build/envsetup.sh
          lunch "$PRODUCT"

          echo "STORAGE BEFORE VENDOR BUILD"
          df -h
          df -ih

          root_build_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          root_build_gb="$((root_build_kb / 1024 / 1024))"
          echo "free_before_build_gb=$root_build_gb"
          if (( root_build_gb < MIN_FREE_BEFORE_BUILD_GB )); then
            echo "FATAL: insufficient working space for vendorimage build."
            echo "Available=${root_build_gb} GiB; required=${MIN_FREE_BEFORE_BUILD_GB} GiB."
            exit 1
          fi

          # ccache is intentionally disabled on this constrained runner.
          export USE_CCACHE=0
          export CCACHE_DISABLE=1

          set +e
          m -j"$BUILD_JOBS" vendorimage 2>&1 | tee -a "$log"
          rc=${PIPESTATUS[0]}
          set -e

          echo "vendorimage_exit=$rc"
          echo "$rc" > "$GITHUB_WORKSPACE/$DIAG_DIR/09-vendorimage-exit-code.txt"

          echo "STORAGE AFTER VENDOR BUILD"
          df -h
          df -ih

          exit "$rc"

      # ============================================================
      # V10 - VERIFY VENDOR IMAGE + VINTF
      # ============================================================
      - name: V10 - Verify vendor image and VINTF
        id: v10
        if: ${{ steps.v09.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/android"
          log="$GITHUB_WORKSPACE/$DIAG_DIR/10-vendor-verification.log"
          exec > >(tee -a "$log") 2>&1

          out="out/target/product/$DEVICE_CODENAME"

          echo "=== VENDOR IMAGES ==="
          find "$out" -maxdepth 1 -type f -name 'vendor*.img' -printf '%p %s bytes\n' 2>/dev/null

          vendor_count="$(find "$out" -maxdepth 1 -type f -name 'vendor*.img' | wc -l)"
          if (( vendor_count == 0 )); then
            echo "FATAL: no vendor*.img was produced."
            exit 1
          fi

          echo "=== VINTF ==="
          find "$out/vendor/etc/vintf" -type f -print 2>/dev/null | sort || true

          echo "=== REQUIRED FEATURE PAYLOAD SCAN ==="
          grep -RniE 'fingerprint|vibrator|haptics|dual.?sim|dsds|mixer_paths|audio_policy|ims|iwlan|vowifi|wifi.?calling' \
            "$out/vendor" 2>/dev/null | head -500 || true

          echo "V10 PASS"

      # ============================================================
      # V11 - ALWAYS COLLECT DIAGNOSTICS
      # ============================================================
      - name: V11 - ALWAYS collect diagnostics
        id: v11
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"

          mkdir -p "$DIAG_DIR" vendor_out

          df -h > "$DIAG_DIR/98-final-disk.log" 2>&1 || true
          df -ih >> "$DIAG_DIR/98-final-disk.log" 2>&1 || true

          {
            echo "LG Velvet LM-G900 - VENDOR ONLY FIXED v27 LOW-STORAGE"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "timestamp=$(date -u +%FT%TZ)"
            echo
            echo "=== STEP OUTCOMES ==="
            echo "V00=${{ steps.v00.outcome }}"
            echo "V01=${{ steps.v01.outcome }}"
            echo "V02=${{ steps.v02.outcome }}"
            echo "V03=${{ steps.v03.outcome }}"
            echo "V04=${{ steps.v04.outcome }}"
            echo "V05=${{ steps.v05.outcome }}"
            echo "V06=${{ steps.v06.outcome }}"
            echo "V07=${{ steps.v07.outcome }}"
            echo "V08=${{ steps.v08.outcome }}"
            echo "V09=${{ steps.v09.outcome }}"
            echo "V10=${{ steps.v10.outcome }}"
            echo
            echo "=== FAILURE SUMMARY ==="
            grep -RniE 'error|fatal|failed|failure|FAIL|ERROR|invalid|not found|does not exist|permission denied|No space left on device|Errno 28|Unable|exception|traceback|lost communication|runner' \
              "$DIAG_DIR" 2>/dev/null | tail -5000 || true
          } > "$DIAG_DIR/99-ERROR-SUMMARY.log"

          {
            echo "========== ERROR LOG (extracted) =========="
            echo "Generated: $(date -u +%FT%TZ)"
            echo
            grep -RniE 'error|fatal|failed|failure|FAIL|ERROR|invalid|not found|does not exist|permission denied|No space left on device|Errno 28|Unable|exception|traceback|lost communication|runner' \
              "$DIAG_DIR" 2>/dev/null | head -2000
          } > "$DIAG_DIR/error.txt"

          out="android/out/target/product/$DEVICE_CODENAME"
          find "$out" -maxdepth 1 -type f -name 'vendor*.img' -exec cp -v {} vendor_out/ \; 2>/dev/null || true

          {
            echo "MANDATORY ERROR LOG:"
            echo "$DIAG_DIR/error.txt"
            echo
            echo "=== DIAGNOSTIC FILES ==="
            find "$DIAG_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort
            echo
            echo "=== VENDOR OUTPUT ==="
            find vendor_out -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort
          } > vendor_out/ARTIFACT-LIST.txt

          tar -czf "vendor_out/LM-G900-VENDOR-DIAGNOSTICS-${GITHUB_RUN_ID}.tar.gz" \
            "$DIAG_DIR" 2>/dev/null || true

      # ============================================================
      # V12 - UPLOAD ARTIFACTS ALWAYS
      # ============================================================
      - name: V12 - Upload vendor diagnostics ALWAYS
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: LM-G900-VENDOR-${{ github.run_id }}
          path: |
            vendor_out/**
            ci-diagnostics/vendor/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

      # ============================================================
      # FINAL STATUS
      # ============================================================
      - name: FINAL - Return vendor status
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ steps.storage_before.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V00.1 runner resource preflight failed."
            exit 1
          fi
          if [[ "${{ steps.cleanup.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V00.2 safe runner cleanup failed."
            exit 1
          fi
          if [[ "${{ steps.v01.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V01 build dependencies/repo launcher setup failed."
            exit 1
          fi
          if [[ "${{ steps.v02.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V02 Android repo initialization failed."
            exit 1
          fi
          if [[ "${{ steps.v03.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V03 repository resolution/manifest failed."
            exit 1
          fi
          if [[ "${{ steps.v04.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V04 full current-source repository sync failed."
            exit 1
          fi
          if [[ "${{ steps.v05.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: V05 source verification failed."
            exit 1
          fi
          if [[ "${{ steps.v08.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: mandatory hardware audit failed."
            exit 1
          fi
          if [[ "${{ steps.v09.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: vendorimage build failed."
            exit 1
          fi
          if [[ "${{ steps.v10.outcome }}" != "success" ]]; then
            echo "VENDOR FAILURE: vendor verification failed."
            exit 1
          fi

          echo "=================================================="
          echo "VENDOR SUCCESS"
          echo "LM-G900 full-source vendor-only workflow completed."
          echo "=================================================="
