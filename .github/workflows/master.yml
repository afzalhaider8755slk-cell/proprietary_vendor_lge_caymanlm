      - name: Build vendor.img
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "   CAYMANLM VENDOR IMAGE BUILD"
          echo "=========================================="

          TOP="${GITHUB_WORKSPACE}"
          VENDOR_SRC="${TOP}/vendor/lge/caymanlm"
          LOG_DIR="${TOP}/vendor-build-logs"
          OUT_DIR="${TOP}/vendor-output"

          mkdir -p "${LOG_DIR}" "${OUT_DIR}"

          exec > >(tee "${LOG_DIR}/vendor-build.log") 2>&1

          echo "[INFO] Workspace: ${TOP}"
          echo "[INFO] Date: $(date -u)"

          # -------------------------------------------------
          # 1. Validate source
          # -------------------------------------------------

          test -f "${VENDOR_SRC}/caymanlm-vendor.mk" || {
            echo "[ERROR] caymanlm-vendor.mk not found"
            exit 1
          }

          test -d "${VENDOR_SRC}/proprietary/vendor" || {
            echo "[ERROR] proprietary/vendor not found"
            exit 1
          }

          echo "[OK] Vendor source validated"

          # -------------------------------------------------
          # 2. Locate Android build tree
          # -------------------------------------------------

          if [[ -f "${TOP}/build/envsetup.sh" ]]; then
            BUILD_TOP="${TOP}"
          elif [[ -d "${TOP}/lineage" && -f "${TOP}/lineage/build/envsetup.sh" ]]; then
            BUILD_TOP="${TOP}/lineage"
          elif [[ -f "${TOP}/aosp/build/envsetup.sh" ]]; then
            BUILD_TOP="${TOP}/aosp"
          else
            echo "[ERROR] Android/LineageOS source tree not found"
            echo "[INFO] Expected build/envsetup.sh"
            exit 1
          fi

          echo "[OK] BUILD_TOP=${BUILD_TOP}"

          cd "${BUILD_TOP}"

          # -------------------------------------------------
          # 3. Copy vendor tree into Android source
          # -------------------------------------------------

          mkdir -p vendor/lge

          rm -rf vendor/lge/caymanlm

          cp -a "${VENDOR_SRC}" vendor/lge/caymanlm

          echo "[OK] vendor/lge/caymanlm installed"

          # -------------------------------------------------
          # 4. Load Lineage/AOSP environment
          # -------------------------------------------------

          source build/envsetup.sh

          echo "[OK] envsetup loaded"

          # -------------------------------------------------
          # 5. Detect caymanlm product
          # -------------------------------------------------

          PRODUCT=""

          for candidate in \
            lineage_caymanlm \
            caymanlm \
            aosp_caymanlm
          do
            if lunch "${candidate}-userdebug" >/dev/null 2>&1; then
              PRODUCT="${candidate}"
              break
            fi
          done

          if [[ -z "${PRODUCT}" ]]; then
            echo "[ERROR] No caymanlm lunch target found"
            echo
            echo "Available caymanlm targets:"
            lunch 2>/dev/null | grep -i caymanlm || true
            exit 1
          fi

          echo "[OK] PRODUCT=${PRODUCT}"

          # Reload environment after successful lunch
          source build/envsetup.sh
          lunch "${PRODUCT}-userdebug"

          # -------------------------------------------------
          # 6. Force vendor package into product
          # -------------------------------------------------

          export PRODUCT_SOONG_NAMESPACES="${PRODUCT_SOONG_NAMESPACES:-}:vendor/lge/caymanlm"

          # Find the product configuration that owns PRODUCT_PACKAGES
          PRODUCT_MK="$(find device vendor -type f \
            \( -name "*${PRODUCT}.mk" -o -name "lineage_${PRODUCT}.mk" \) \
            2>/dev/null | head -1 || true)"

          if [[ -n "${PRODUCT_MK}" ]]; then
            echo "[INFO] Product MK: ${PRODUCT_MK}"
          else
            echo "[WARN] Product MK not directly located"
          fi

          # -------------------------------------------------
          # 7. Verify vendor makefile
          # -------------------------------------------------

          echo
          echo "=== Vendor MK ==="
          head -30 vendor/lge/caymanlm/caymanlm-vendor.mk

          grep -q "PRODUCT_COPY_FILES" \
            vendor/lge/caymanlm/caymanlm-vendor.mk || {
              echo "[ERROR] PRODUCT_COPY_FILES missing"
              exit 1
            }

          # -------------------------------------------------
          # 8. Build vendor image
          # -------------------------------------------------

          echo
          echo "=========================================="
          echo "   STARTING vendorimage BUILD"
          echo "=========================================="

          BUILD_START="$(date +%s)"

          if ! m vendorimage -j"$(nproc)"; then
            echo "[ERROR] vendorimage build failed"

            echo
            echo "=== OUT DIRECTORY ==="
            find out/target/product -maxdepth 3 \
              -type f \
              \( -name "*vendor*" -o -name "*.log" \) \
              -ls 2>/dev/null || true

            exit 1
          fi

          BUILD_END="$(date +%s)"

          echo
          echo "[OK] vendorimage build completed"
          echo "[INFO] Build time: $((BUILD_END - BUILD_START)) seconds"

          # -------------------------------------------------
          # 9. Locate vendor.img
          # -------------------------------------------------

          VENDOR_IMG=""

          while IFS= read -r candidate; do
            if [[ -f "${candidate}" ]]; then
              VENDOR_IMG="${candidate}"
              break
            fi
          done < <(
            find "out/target/product" \
              -type f \
              -name "vendor.img" \
              2>/dev/null
          )

          if [[ -z "${VENDOR_IMG}" ]]; then
            echo "[ERROR] vendor.img was NOT generated"
            exit 1
          fi

          echo "[OK] vendor.img found:"
          echo "${VENDOR_IMG}"

          # -------------------------------------------------
          # 10. Copy only final image
          # -------------------------------------------------

          cp -f "${VENDOR_IMG}" "${OUT_DIR}/vendor.img"

          sync

          IMG_SIZE_BYTES="$(stat -c '%s' "${OUT_DIR}/vendor.img")"
          IMG_SIZE_MB="$((IMG_SIZE_BYTES / 1024 / 1024))"

          echo
          echo "=== vendor.img ==="
          ls -lh "${OUT_DIR}/vendor.img"
          echo "[INFO] Size: ${IMG_SIZE_MB} MB"

          # -------------------------------------------------
          # 11. SHA256
          # -------------------------------------------------

          sha256sum "${OUT_DIR}/vendor.img" \
            | tee "${OUT_DIR}/vendor.img.sha256"

          # -------------------------------------------------
          # 12. Image filesystem check
          # -------------------------------------------------

          echo
          echo "=== Filesystem check ==="

          if command -v file >/dev/null 2>&1; then
            file "${OUT_DIR}/vendor.img" \
              | tee "${LOG_DIR}/vendor-image-file.txt"
          fi

          if command -v simg2img >/dev/null 2>&1; then
            simg2img \
              "${OUT_DIR}/vendor.img" \
              "${OUT_DIR}/vendor.raw.img" || true

            if [[ -f "${OUT_DIR}/vendor.raw.img" ]]; then
              file "${OUT_DIR}/vendor.raw.img" || true
            fi
          fi

          # -------------------------------------------------
          # 13. Feature audit against source
          # -------------------------------------------------

          AUDIT="${OUT_DIR}/vendor-feature-audit.txt"

          {
            echo "=========================================="
            echo "CAYMANLM VENDOR FEATURE AUDIT"
            echo "=========================================="
            echo
            echo "Source: vendor/lge/caymanlm"
            echo "Product: ${PRODUCT}"
            echo

            echo "=== Fingerprint ==="
            find vendor/lge/caymanlm/proprietary \
              -type f | grep -Ei \
              'finger|fps|goodix|fpc|syna|biometric' \
              | head -100 || true

            echo
            echo "=== Vibration / Haptic ==="
            find vendor/lge/caymanlm/proprietary \
              -type f | grep -Ei \
              'vib|haptic|motor|qti.*vib' \
              | head -100 || true

            echo
            echo "=== Dual-SIM / RIL ==="
            find vendor/lge/caymanlm/proprietary \
              -type f | grep -Ei \
              'radio|ril|qcril|modem|ims' \
              | head -150 || true

            echo
            echo "=== Audio ==="
            find vendor/lge/caymanlm/proprietary \
              -type f | grep -Ei \
              'audio|acdb|adsp|audio.primary|audio_policy' \
              | head -150 || true

            echo
            echo "=== IMS / VoLTE ==="
            find vendor/lge/caymanlm/proprietary \
              -type f | grep -Ei \
              'ims|volte|qti.*ims|imsrcs' \
              | head -150 || true

            echo
            echo "=== Wi-Fi / VoWiFi ==="
            find vendor/lge/caymanlm/proprietary \
              -type f | grep -Ei \
              'wifi|wlan|wpa|hostap|iwlan|vowifi' \
              | head -150 || true

            echo
            echo "=== VINTF / HAL manifests ==="
            find vendor/lge/caymanlm/proprietary \
              -type f | grep -Ei \
              'manifest.*xml|compatibility.*xml|vintf' \
              | head -100 || true

          } | tee "${AUDIT}"

          # -------------------------------------------------
          # 14. Compression strategy
          # -------------------------------------------------

          echo
          echo "=========================================="
          echo "   STORAGE-SAFE ARTIFACT PACKAGING"
          echo "=========================================="

          if [[ "${IMG_SIZE_BYTES}" -gt $((500 * 1024 * 1024)) ]]; then

            echo "[INFO] vendor.img > 500 MB"
            echo "[INFO] Creating compressed archive"

            tar -C "${OUT_DIR}" \
              -czf "${OUT_DIR}/vendor.img.tar.gz" \
              vendor.img

            rm -f "${OUT_DIR}/vendor.img"

            echo "[OK] Raw vendor.img removed from artifact directory"

          else

            echo "[INFO] vendor.img <= 500 MB"
            echo "[OK] Keeping raw vendor.img"

          fi

          # -------------------------------------------------
          # 15. Final output
          # -------------------------------------------------

          echo
          echo "=== FINAL OUTPUT ==="
          find "${OUT_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          echo
          echo "=== FINAL DISK USAGE ==="
          df -h .

          echo
          echo "=========================================="
          echo "   VENDOR BUILD STAGE COMPLETE"
          echo "=========================================="
